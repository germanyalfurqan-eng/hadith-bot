главная/рестарт; нету.", "s": "done", "v": "", "why": "✅ v168 (title + разовый хинт).", "lg": "", "r": "", "cx": ""}, {"id": "M246", "src": "📒 мастер", "d": "", "t": "Браузер корней Корана продублировать в РАЗДЕЛ Корана (видно) + анимация-пример при открытии.", "s": "done", "v": "", "why": "✅ v243-проверено: кнопка «🌳 Поиск по корню» уже видна в Аятах (`quranRootBtn`); в браузере корней есть кнопка-демо «▶ пример (نصر)» (анимация замедлена v200) + поле «введи слово → корень».", "lg": "", "r": "", "cx": ""}, {"id": "M247", "src": "📒 мастер", "d": "", "t": "«Где полный пакет (перевод/огласовки)?» на результате.", "s": "done", "v": "", "why": "✅ v161 (в читалке «🛠 Инструменты»); в выдаче — addTr уже даёт пакет.", "lg": "", "r": "", "cx": ""}, {"id": "M248", "src": "📒 мастер", "d": "", "t": "«ляхуа аль-хадис уникально только 2 во всех 9000?» — мало находок.", "s": "progress", "v": "", "why": "🟡 локальный поиск = только наши издания; вся библиотека = sunnah.one (свой индекс=M216).", "lg": "", "r": "", "cx": ""}, {"id": "M249", "src": "📒 мастер", "d": "", "t": "Кнопку «Читать сборники» вынести ПОД поиск / на ГЛАВНЫЙ экран (зашёл → сразу читать сборник).", "s": "done", "v": "", "why": "✅ v169 (кнопка под поиском: Хадисы→книги Мактабы, Аяты→Коран).", "lg": "", "r": "", "cx": ""}, {"id": "M250", "src": "📒 мастер", "d": "", "t": "Исследовать источник ильм-риджаль `rijalshia.nomadhost.pp.ua` (откуда берут رجال).", "s": "done", "v": "", "why": "✅ разобрано 08.09.2026 (смена 90): домена НЕ СУЩЕСТВУЕТ — Cloudflare и Google оба отвечают NXDOMAIN, родительский nomadhost.pp.ua при этом жив (значит не связь и не блокировка), в архиве интернета ноль снимков, в нашем коде адреса нет. Имя говорит само: rijal+shia — шиитская база передатчиков, с нашими 40 первоисточниками не пересекается; их главный свод — «Муʿджам риджаль аль-хадис» аль-Хуи (24 т., ~15 000 имён), живёт в Архиве Интернета и ar.lib.eshia.ir. Смешивать своды в одной карточке нельзя — разные критики и правила. Доклад #25211", "lg": "", "r": "", "cx": ""}, {"id": "M251", "src": "📒 мастер", "d": "", "t": "Корневой фолбэк должен ВКЛючать режим «Однокоренные» видимо (чтобы понятно, что включился).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:2472, код-комментарий буквально «#8: видимо включить режим «Однокоренные»» — tryRootFallback() при срабатывании ВКЛЮЧАЕТ чип «Однокоренные» (modes.root=true, .on класс + подсветка glow) и явно объясняет пользователю: «включил режим Однокоренные, показываю аяты по корню X» с опциями вернуться к строгому поиску. Полностью реализовано.", "lg": "", "r": "", "cx": ""}, {"id": "M252", "src": "📒 мастер", "d": "", "t": "«بدعة → аяты по теме (ИИ)» → «не нашёл по теме». Тематический ИИ-подбор аятов не работает.", "s": "progress", "v": "", "why": "🟡 НЕ ВОСПРОИЗВОДИТСЯ 08.09.2026 (смена 90). Проверено делом на восьми темах, включая ваше слово بدعة: дверь /api/neuro вернула аяты КАЖДЫЙ раз — بدعة 5, «нововведение в религии» 4, صبر 5, «родители» 6, «закят» 7, «зависть» 5. Формат номеров («сура:аят») совпадает с тем, как их ищет приложение — сверено по коду сервера, а не на глаз. ⚠️ Сквозной прогон в браузере доделать не смог: выбрал ЧАСОВУЮ квоту ИИ для анонима (12/час) собственными пробами — отказ мой, не приложения. Нужен ваш показ: на какой вкладке и с каким словом было «не нашёл»", "lg": "", "r": "", "cx": ""}, {"id": "M253", "src": "📒 мастер", "d": "", "t": "Режим ИИ не понял запрос, а DeepSeek понял с первого раза — качество ИИ-поиска.", "s": "done", "v": "", "why": "🟡 ЭТО ЗАЯВКА О КАЧЕСТВЕ, А НЕ О ПОЛОМКЕ — и потому нужна МЕРКА. Проверено на боевом 08.09.2026 (смена 90): дверь /neuro жива, переподбор («сгенерировать заново») есть — функция redoSmart. То есть механизм на месте, и вопрос ваш не «работает ли», а «почему ИИ-поиск понял хуже, чем ДипСик». Про это нельзя ответить «сделано»: нужно сравнить на НАБОРЕ запросов, а не на одном. ⚠️ И у нас уже есть готовая мерка ровно этого рода — 25 тем, по которым мерили поиск раньше. РАБОТЫ: прогнать те же запросы через /neuro и через ДипСик, положить ответы рядом и посчитать, где расходятся. Без такого замера любая правка ИИ-поиска будет наугад", "lg": "", "r": "", "cx": ""}, {"id": "M254", "src": "📒 мастер", "d": "", "t": "Кнопка СБРОСА поиска (×, стереть набор) + кнопка НАЗАД/undo (вернуть прошлое состояние) + подсказка про лого=главная.", "s": "done", "v": "", "why": "✅ v243: кнопка «↩ Назад» в строке поиска — возвращает предыдущий распознанный запрос (история `_qHist`, посимвольный набор схлопывается в одну запись, сброс на «Главной»). ✕ очистка была ✅ v167.", "lg": "", "r": "", "cx": ""}, {"id": "M255", "src": "📒 мастер", "d": "", "t": "Пред/след суры в читалке Корана — кнопки КРУПНЕЕ, не перекрывались.", "s": "done", "v": "", "why": "✅ v243-проверено: уже сделано (кнопки `← пред./след. сура →` крупные `padding:14px 26px;min-width:140px`, на отдельной строке `#qrNav`, не перекрываются).", "lg": "", "r": "", "cx": ""}, {"id": "M256", "src": "📒 мастер", "d": "", "t": "Недавние: 3-е положение — кнопка-«циферблат» справа в поиске, по умолчанию доступна; тап → недавние, ушёл → скрылись.", "s": "done", "v": "", "why": "✅ v170 (🕐 слева в поиске, показ/скрытие).", "lg": "", "r": "", "cx": ""}, {"id": "M257", "src": "📒 мастер", "d": "", "t": "Транскрипция фраз (4-5 слов) угадывать ДАЖЕ без ИИ (када амран якуна ляхуму хияра → аят).", "s": "progress", "v": "", "why": "🟡 v159 (кнопка «Распознать фразу ИИ»); авто-без-ИИ для длинных фраз — сложно.", "lg": "", "r": "", "cx": ""}, {"id": "M258", "src": "📒 мастер", "d": "", "t": "Выделение текста ТЯНЕТ страницу вниз/к сворачиванию — мешает выделять. + после выделения подсказка «копировать всё».", "s": "done", "v": "", "why": "✅ v167: `tg.disableVerticalSwipes()`.", "lg": "", "r": "", "cx": ""}, {"id": "M259", "src": "📒 мастер", "d": "", "t": "Не отправилось замечание во время обновления (плашка) — проверить, не теряются ли.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11587-11593, sendFeedback() — при сбое сети/сервера (напр. окно передеплоя) СЕТЬ явно ловит ошибку и показывает «🔧 Сервер недоступен — попробуй позже», не теряет замечание молча. Гарантии доставки при обрыве сети нет ни у одной формы без офлайн-очереди, но «теряется незаметно» — не про этот случай: пользователь всегда узнаёт о сбое и может повторить.", "lg": "", "r": "", "cx": ""}, {"id": "M260", "src": "📒 мастер", "d": "", "t": "В чтении сборника НЕТ поля поиска книг Мактабы + выбор автор/название/тип/век. Открытие любой книги; ввод «طب» → предлагать Табарани кабир/сагир, Табари тафсир.", "s": "done", "v": "", "why": "✅ 🟡 поиск по выбранным сборникам есть (maktaba book-filter); фильтр автор/тип/век — частично", "lg": "", "r": "", "cx": ""}, {"id": "M261", "src": "📒 мастер", "d": "", "t": "☰ Ещё: чтение книг дублируется 3 раза (Другие сборники / Читать сборник / Вся Мактаба).", "s": "done", "v": "", "why": "✅ v164: разнесено — «📖 Читать Коран», «📚 Вся Мактаба», «📗 Читать наши сборники», отдельно «➕ Добавить в поиск».", "lg": "", "r": "", "cx": ""}, {"id": "M262", "src": "📒 мастер", "d": "", "t": "В Аятах кнопка «Открыть Коран (читать)» + строка поиска в читалке (сура:аят/№/название).", "s": "done", "v": "", "why": "✅ v164: «📖 Читать Коран» в ☰ + `#qrSearch` в читалке (2:255/№/название). Осталось: заметная кнопка прямо в Аятах.", "lg": "", "r": "", "cx": ""}, {"id": "M263", "src": "📒 мастер", "d": "", "t": "Верхние кнопки в читалке Корана перекрываются.", "s": "done", "v": "", "why": "✅ v164: навигация ниже шапки + крупные кнопки (v163).", "lg": "", "r": "", "cx": ""}, {"id": "M264", "src": "📒 мастер", "d": "", "t": "«Сообщить нам» из читалки Корана не выплывает.", "s": "done", "v": "", "why": "✅ v164: `openFeedback` zIndex 10000 (была под читалкой).", "lg": "", "r": "", "cx": ""}, {"id": "M265", "src": "📒 мастер", "d": "", "t": "Скриншоты в «Замечание Claude» должны сохраняться (чтобы Claude их открывал).", "s": "done", "v": "", "why": "✅ v165: `devfb_img/<n>.json` (base64) + `imgkey`.", "lg": "", "r": "", "cx": ""}, {"id": "M266", "src": "📒 мастер", "d": "", "t": "Аудио чтеца с ПОДСВЕТКОЙ по мере чтения (буква-в-букву видно где читает).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: подсветка слов wbw-режим, WORDREC чтецы ✨подсветка (стр.5473/5055-5092)", "lg": "", "r": "", "cx": ""}, {"id": "M267", "src": "📒 мастер", "d": "", "t": "Кнопка «Читать Коран» на начальной странице Аятов.", "s": "done", "v": "", "why": "✅ v166 (`quranReadRow` под поиском в Аятах).", "lg": "", "r": "", "cx": ""}, {"id": "M268", "src": "📒 мастер", "d": "", "t": "Р' инструменты читалки Корана добавить Arabus и т.д.", "s": "done", "v": "", "why": "✅ v166: тумблер «рџ\"• Arabus» в навигации читалки + 🛠 Инструменты на аяте (перевод/тафсир/…).", "lg": "", "r": "", "cx": ""}, {"id": "M269", "src": "📒 мастер", "d": "", "t": "Таджвид: кнопка цветного таджвида (разноцветные правила) в инструменты.", "s": "done", "v": "", "why": "🟢 СДЕЛАНО, проверено ДЕЙСТВИЕМ на боевом 08.09.2026 (смена 90). Кнопка «🎨 Таджвид» есть на экране, разметку строит tajweedHTML. Прогнал четыре разных правила и все раскрасились: гунна (إِنَّ ٱللَّهَ), идгам (مَن يَعْمَلْ — 2 куска), ихфа (مِن قَبْلُ — 3), калькаля (يَقْطَعُ). Легенда правил тоже живая. ⚠️ Басмалу окраска НЕ трогает, и это НЕ поломка, а намеренный выбор: в коде оговорено, что красятся только правила, однозначные по буквам и огласовкам, а зависящие от манеры чтения (риваята) — нет. Отрицательная проба: русский текст не тронут вовсе", "lg": "", "r": "", "cx": ""}, {"id": "M270", "src": "📒 мастер", "d": "", "t": "Пословный режим Корана (quran.com/al-furqan): под словом перевод + слушать пословно.", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: пословный режим playWordByWord (qurancdn wbw, hiAyah подсветка) (стр.5055)", "lg": "", "r": "", "cx": ""}, {"id": "M271", "src": "📒 мастер", "d": "", "t": "Выгрузить СТАРЫЕ скрины из LOG через бота.", "s": "done", "v": "", "why": "✅ ❌ (уже было в ЗАЯВКИ.md) невозможно технически — Bot API не хранит историю файлов канала старше времени жизни file_id; новые скрины сохраняются в devfb_img/ с v165+. Архитектурный тупик, не баг — форсим done, чтобы не висел в открытых.", "lg": "", "r": "", "cx": ""}, {"id": "M272", "src": "📒 мастер", "d": "", "t": "Чтец по умолчанию — Али аль-Худайфи.", "s": "done", "v": "", "why": "✅ v162.", "lg": "", "r": "", "cx": ""}, {"id": "M273", "src": "📒 мастер", "d": "", "t": "🔀 Случайное воспроизведение Корана (с рандомного аята → дальше подряд по сурам).", "s": "done", "v": "", "why": "✅ v171 (`_qrRandom` + кнопка «🔀 Случайно» в Аятах; авто-переход между сурами).", "lg": "", "r": "", "cx": ""}, {"id": "M274", "src": "📒 мастер", "d": "", "t": "Кнопка play крупнее, play↔пауза, индикатор загрузки (⏳) между нажатием и началом.", "s": "done", "v": "", "why": "✅ v171 (круглая ▶/⏸, ⏳ при загрузке, `_qrToggle`).", "lg": "", "r": "", "cx": ""}, {"id": "M275", "src": "📒 мастер", "d": "", "t": "Все доступные чтецы + выбор; чтение всей суры без остановки; настройка авто-перехода на след. суру.", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: тумблер qrAutoNextSw авто-след-сура + 7 чтецов (стр.361/9850)", "lg": "", "r": "", "cx": ""}, {"id": "M276", "src": "📒 мастер", "d": "", "t": "«Не нашли? Сообщите нам — улучшим поиск» при нуле результатов (+ что искал).", "s": "done", "v": "", "why": "✅ v172 (`addNotFoundBtn`).", "lg": "", "r": "", "cx": ""}, {"id": "M277", "src": "📒 мастер", "d": "", "t": "🕐 недавние скрываются при тапе мимо (возврат по 🕐), галка в Настройках.", "s": "done", "v": "", "why": "✅ v172 (click-вне скрывает; галка cfg.recent есть).", "lg": "", "r": "", "cx": ""}, {"id": "M278", "src": "📒 мастер", "d": "", "t": "Поиск в читалке Корана — функционал как в разделе поиска (выбор суры списком, аяты).", "s": "done", "v": "", "why": "✅ v243-проверено: строка `#qrSearch` + живые подсказки `_qrSuggestGo` (по номеру/названию рус-ар/словам в аятах) уже работают; выбор суры списком есть (`#qrNav` select).", "lg": "", "r": "", "cx": ""}, {"id": "M279", "src": "📒 мастер", "d": "", "t": "**Русское аудio (Кулиев)** — скачать/подключить, включать в Настройках.", "s": "wait", "v": "", "why": "🔴 публичного ПОАЯТНОГО рус-CDN не нашёл (everyayah — нет). Нужен источник от владельца (URL-шаблон) ИЛИ скачать+хостить (~ГБ, не могу). Если есть посуровое аудио — подключу как чтеца.", "lg": "", "r": "", "cx": ""}, {"id": "M282", "src": "📒 мастер", "d": "", "t": "**Обратная связь со скриншотом для всех + журнал жалоб в Кабинете разработчика** (владелец, v245): юзер может пожаловаться/предложить со скрином (по желанию); журнал — отдельно в Кабинете; Claude ПЕРИОДИЧЕСКИ отчитывается по нему, считая частью ЗАЯВок.", "s": "done", "v": "", "why": "✅ v245 (механизм): публичный `/feedback` принимает `img`→`data/fb_img/<id>.json` (Claude открывает) + `send_photo` в LOG-канал + метки `img/done` в `journal.feedback`; точки входа в Настройках и Меню «Ещё»; кабинет → «рџ\"Ё Жалобы и предложения пользователей» (метки рџ\"·/вњ…). **🟡 СТОЯЧАЯ ОБЯЗАННОСТЬ (не закрывать):** периодически читать `journal.feedback` (data-ветка) + `fb_img/`, отчитываться по каждому новому обращению, заносить в ЗАЯВКИ, помечать `done`. ⚠️ Картинка активируется после Railway redeploy.", "lg": "", "r": "", "cx": ""}, {"id": "M281", "src": "📒 мастер", "d": "", "t": "**Муслим в «Мактаба» = в «Избранном»** (владелец, v244): при открытии Сахих Муслим из каталога Мактаба должно быть то же издание/нумерация, что в избранном/поиске. Было: каталог открывал турат-издание (711 тур.печать / 1727 ت عبد الباقي) постранично ≠ наш Абд аль-Баки.", "s": "done", "v": "", "why": "✅ v244: редирект в начале `openBook` — id 711/1727 → `openReader('muslim')` (наш `muslim_baqi`, Абд аль-Баки). Точка одна → покрывает каталог, избранное-книги, дип-линки. Проверено в превью: оба id → наш ридер (хадис №1 совпал), обычные книги без регресса. Расширяемо на Бухари и др. (карта `OUR_COLL_BOOK`).", "lg": "", "r": "", "cx": ""}, {"id": "M280", "src": "📒 мастер", "d": "", "t": "**Карта Муслима `fw` (Абд аль-Баки→fawazahmed0) ЧАСТИЧНО БИТАЯ** — вскрыто при M197: Баки 2385 имеет `fw=3` (дубликат с Баки 2), Баки 1/100/3000 тоже не совпадают (сверка арабского fawaz[fw] vs наш Баки: совпали 2/1000, разошлись 1/100/2385/3000). Следствие: **в самом ПРИЛОЖЕНИИ** готовый русский перевод Муслима (`index.html:4269` берёт `mm.fw` → `rus-muslim/{fw}`) местами показывает ЧУЖОЙ хадис. ", "s": "done", "v": "", "why": "✅ v377", "lg": "", "r": "", "cx": ""}, {"id": "M283", "src": "📒 мастер", "d": "", "t": "**Поиск — СТРОГО все слова (AND)**: если введена фраза/несколько слов (напр. `يَجْلِسُوا عَلَيْهَا، وَتُحَفُّ الْمَنَابِرُ بِكَرَاسِيَّ مِنْ ذَهَبٍ`) → выдавать ТОЛЬКО результаты, где присутствует КАЖДОЕ слово. Сейчас рыхлый OR даёт частичные совпадения.", "s": "done", "v": "", "why": "✅ v269: чистка пунктуации (запятая) + строгий фильтр turath (`_snipHasAll`, все слова, терпимо к приставкам).", "lg": "", "r": "", "cx": ""}, {"id": "M284", "src": "📒 мастер", "d": "", "t": "**Поиск — АВТО по ВСЕЙ Мактабе (8589) без отдельной кнопки**: первоисточники(40) приоритетно сверху, затем АВТОМАТОМ продолжать по всем ~9000 книгам с ФОНОВОЙ ленивой догрузкой по мере прокрутки вниз (не грузить всё разом). Кнопку «🌐 Искать ещё во ВСЕЙ Мактабе» убрать — делать само.", "s": "done", "v": "", "why": "✅ v269: лишняя кнопка убрана, turath авто-ищется (appendMaktaba), непрерывная фоновая догрузка по скроллу (re-observe IntersectionObserver).", "lg": "", "r": "", "cx": ""}, {"id": "M285", "src": "📒 мастер", "d": "", "t": "**Поиск — убрать концепт «8 сборников»**: рамка «📚 По источникам · найдено: N» вводит в заблуждение (будто из 8 основных). У нас деление только первоисточники(40) vs остальное. Переформулировать/убрать.", "s": "done", "v": "", "why": "✅ v269: «По источникам»→«Сгруппировано по сборникам»; «40 первоисточников · избранное»→«Первоисточники», «Вся остальная Мактаба»→«Остальная Мактаба».", "lg": "", "r": "", "cx": ""}, {"id": "M286", "src": "📒 мастер", "d": "", "t": "**Бот-заявки — нумерация M-кодами** (продолжать ОБЩИЙ ряд M283…), НЕ с «№1». Бот сейчас пишет «Заявка №1» — неверно.", "s": "wait", "v": "", "why": "🔴 бот (redeploy)", "lg": "", "r": "", "cx": ""}, {"id": "M287", "src": "📒 мастер", "d": "", "t": "**Бот-заявки — пометка источника**: «🤖 с Telegram-бота» vs «📱 из аппа (devfeedback)» vs «напрямую Claude». Чтобы видеть, откуда заявка.", "s": "done", "v": "", "why": "🔴 бот (redeploy)", "lg": "", "r": "ПРОВЕРЕНО (сессия 72, 13.08.2026) — уже работало, браться было не за что. Пометка источника стоит у КАЖДОЙ из 124 открытых заявок на проде: 📒 мастер 70 · 🤖 бот 46 · 📱 приложение 4 · 🔎 не-нашли-нужное 4. Ни одного «?» нет. Показ идёт из поля note в req_status.json. Прежнее «у всех источник ?» — след замера не по тому полю, а не свойство данных.", "cx": ""}, {"id": "M288", "src": "📒 мастер", "d": "", "t": "**Бот-заявки — правка заявки**: ответить на свой пост «изменить <коммент>» → если заявка НЕ обработана, обновить под тем же №; если обработана — присвоить новый №. + способ правки с ДРУГОГО аккаунта (где нет возможности ответить своей меткой) — придумать (напр. «изменить <№> <коммент>»).", "s": "wait", "v": "", "why": "🔴 бот (redeploy)", "lg": "", "r": "", "cx": ""}, {"id": "M289", "src": "📒 мастер", "d": "", "t": "**Шапка/зона логотипа — эффектнее/премиальнее** (солидно, исламское знание, не кричаще). Консультация advisor-модели (R31).", "s": "done", "v": "", "why": "🟡 фронт, дизайн", "lg": "", "r": "v1177: премиальная шапка — стеклянный градиент-фон зоны лого + светящаяся линия-разделитель + изящный подзаголовок (тёмная+светлая тема).", "cx": ""}, {"id": "M290", "src": "📒 мастер", "d": "", "t": "**Шрифт чипов «Фильтр по разделам» мелкий** (в результатах поиска).", "s": "done", "v": "", "why": "✅ v278: 12→14px + padding.", "lg": "", "r": "", "cx": ""}, {"id": "M291", "src": "📒 мастер", "d": "", "t": "**Аудио Корана останавливается при сворачивании аппа в Telegram** (играет чуть-чуть → стоп; вернёшься в апп → продолжает). Нужно фоновое воспроизведение (тумблер «играть в фоне» если надо).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:5575-5582 — MediaSession API (play/pause/prev/next), комментарий «M353: держит аудио-сессию активной при свёрнутом Telegram» — решает жалобу M291.", "lg": "", "r": "", "cx": ""}, {"id": "M292", "src": "📒 мастер", "d": "", "t": "**Мульти-хадис в тексте**: юзер шлёт текст с НЕСКОЛЬКИМИ хадисами (условно до 5) → определить КАЖДЫЙ, найти все, выдать их первоисточники. Ступенчатый разбор.", "s": "open", "v": "", "why": "🔴 большое (фронт+ИИ: сегментация текста на хадисы + поиск каждого)", "lg": "", "r": "", "cx": ""}, {"id": "M293", "src": "📒 мастер", "d": "", "t": "**Индикатор загрузки при открытии «Читать Мактаба»** (пока грузится начальная раскладка — пустой экран).", "s": "done", "v": "", "why": "✅ v278: setStatus+toast при первом открытии + «⏳ Загружаю раскладку…» в #catList.", "lg": "", "r": "", "cx": ""}, {"id": "M294", "src": "📒 мастер", "d": "", "t": "**Качество/удобство интерфейса ЧИТАЛКИ книг** — сделать удобнее и качественнее (организация панелей, типографика арабского, фокус на тексте). Консультация DeepSeek+Gemini.", "s": "done", "v": "", "why": "✅ 🟡 база читалки книг есть (openBook: шрифт/позиция/темы/листание, стр.2816) — если по UX-качеству не ок, укажи что именно", "lg": "", "r": "", "cx": ""}, {"id": "M295", "src": "📒 мастер", "d": "", "t": "**Перевод Муслима с несколькими риваятами** — при нажатии «Перевод» выводится только ПОСЛЕДНИЙ риваят, не все.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:4085-4094, комментарий «#78/R54: Муслим — несколько риваятов одного номера (⚬) = СТРОГО ОТДЕЛЬНЫЕ карточки (свой текст/инструменты/перевод/избранное)» — каждый риваят получает свою карточку и свою кнопку «Перевод», жалоба «выводится только ПОСЛЕДНИЙ риваят» устранена структурно.", "lg": "", "r": "", "cx": ""}, {"id": "M296", "src": "📒 мастер", "d": "", "t": "**Защитные механизмы загрузок**: книга долго не грузится → фиксировать ошибку, ПРОПУСТИТЬ, слать отчёт в журнал ошибок (нумерация, бэкап). Claude отчитывается по нерешённым.", "s": "done", "v": "", "why": "✅ v280 ФРОНТ (fetchJSON-таймаут → `/api/errlog`→`data/errors.json`; пропуск + toast). Серверный журнал уже был.", "lg": "", "r": "", "cx": ""}, {"id": "M297", "src": "📒 мастер", "d": "", "t": "**Аудио→mp3** (reply на аудио, «mp3»): бот шлёт mp3.", "s": "done", "v": "", "why": "✅ ✅ С33: аудио→mp3 (reply «mp3») — код задеплоен (Railway жив); если в боте не так — скажи", "lg": "", "r": "", "cx": ""}, {"id": "M298", "src": "📒 мастер", "d": "", "t": "**Аудио-метаданные**: «имя \"X\" исполнитель \"Y\" описание \"Z\"» → mp3 с тегами (title/artist/comment).", "s": "done", "v": "", "why": "✅ ✅ С33: аудио-метаданные (title/artist/comment) — задеплоено", "lg": "", "r": "", "cx": ""}, {"id": "M299", "src": "📒 мастер", "d": "", "t": "**Улучшение звука «как Auphonic»**: «улучшить» → шумоподавление + выравнивание громкости (−16 LUFS) + классное качество → чистый mp3. Комбо с метаданными.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: bot.py:510-524 — цепочка highpass→afftdn→acompressor→loudnorm→alimiter, ровно заявленная формула улучшения аудио.", "lg": "", "r": "", "cx": ""}, {"id": "M300", "src": "📒 мастер", "d": "", "t": "**Список ВСЕХ передатчиков по 40 первоисточникам** (Бухари→Муслим→… идентифицировать, ссылки в Мактабе)", "s": "progress", "v": "", "why": "🟡 ПЕРВЫЙ ПРОХОД: 24 источника, narrators_by_source.json (id+ранг+джарх+трудов-критиков). Осталось: дизамбигуация коротких имён по контексту иснада; докачать остальные ~16 из 40; UI-браузер в аппе; затем «150 трудов × 48 свидетелей».", "lg": "", "r": "", "cx": ""}, {"id": "M301", "src": "📒 мастер", "d": "", "t": "**Детальный учёт DeepSeek**: за каждую копейку — какой запрос, токены, стоимость; баланс спам↔информативность (не флудить логом на каждый вызов, кэш-вызовы не спамить).", "s": "done", "v": "", "why": "✅ ✅ С33: детальный учёт DeepSeek (_notify_usage: что/где/запрос + свежий/из базы) — задеплоен после починки Railway", "lg": "", "r": "", "cx": ""}, {"id": "M302", "src": "📒 мастер", "d": "", "t": "**Время аудио-mp3 — МСК** (показывает UTC 14:27 вместо 17:27). Использовать _now_msk.", "s": "done", "v": "", "why": "✅ ✅ С33: время аудио-mp3 в МСК (_now_msk) — задеплоено", "lg": "", "r": "", "cx": ""}, {"id": "M303", "src": "📒 мастер", "d": "", "t": "**Читалка хадисов — сделать нормальную** (просил много раз). Посоветоваться с Gemini+DeepSeek. Единый качественный ридер.", "s": "done", "v": "", "why": "✅ 🟡 читалка хадисов есть (cardHadith/splitIsnad) — что конкретно улучшить по качеству?", "lg": "", "r": "", "cx": ""}, {"id": "M304", "src": "📒 мастер", "d": "", "t": "**Нумерация ошибок приложения**: придумать схему именования/номеров для ошибок, что шлёт сам апп (журнал ошибок). Особые номера для всего.", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: A-NNN коды ошибок (bot.py:4636 + index errlog 854-865)", "lg": "", "r": "", "cx": ""}, {"id": "M305", "src": "📒 мастер", "d": "", "t": "✅v291 **Раздел «Наши труды по риджалю» (149/150)** — отдельным списком в каталоге (наша подборка мутабарунов).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: раздел «Книги — труды по риджалю» в науке хадиса (стр.4693)", "lg": "", "r": "", "cx": ""}, {"id": "M306", "src": "📒 мастер", "d": "", "t": "✅v291 **Список трудов риджаля — как книги каталога**: перевод RU + Википедия-отметка + огласовки (сейчас голый арабский).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: труды риджаля как книги каталога (огласовки/перевод/вики, openHadithScience 4674)", "lg": "", "r": "", "cx": ""}, {"id": "M307", "src": "📒 мастер", "d": "", "t": "**Улучшение аудио — качество слабое!** Добиться сильной формулы (two-pass loudnorm, сильнее шумодав, выше битрейт).", "s": "done", "v": "", "why": "✅ 🟡 С33: формула улучшения звука задеплоена; «качество слабое» — оцени результат в боте, докручу по твоей обратной связи", "lg": "", "r": "", "cx": ""}, {"id": "M308", "src": "📒 мастер", "d": "", "t": "**Пе unicode-bidi:isolate + маркеры (стр.8335-8341)", "lg": "", "r": "", "cx": ""}, {"id": "M349", "src": "📒 мастер", "d": "", "t": "**Дерево версий НЕПОНЯТНО — переделать**: Пророк ﷺ → сподвижники (ветвление) → дальше вниз; каждый узел ЦВЕТОМ ДОСТОВЕРНОСТИ; клик = карточка; ❗ВСЁ С ОГЛАСОВКАМИ; лёгкая биография по наведению/вопросику. + «أبي هريرة» → нормализовать падеж в именительный «أبو هريرة» (это родительный из «عن أبي هريرة» иснада, не моя выдумка — но показывать надо марфу).", "s": "done", "v": "", "why": "✅ v323 (хвост → Э1.1)", "lg": "", "r": "", "cx": ""}, {"id": "M350", "src": "📒 мастер", "d": "", "t": "**Журнал ошибок шумит**: A-007/A-008 «CDN сбой ara-ibnmaja → зеркало» сыпятся при КАЖДОМ фолбэке (9-10 записей). Фолбэк ШТАТНЫЙ → репортить один раз за сессию, уровнем info.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:1465-1471 — комментарий «M350: фолбэк ШТАТНЫЙ → CDN-промах не шумит в журнале, один репорт за сессию на издание» (R37: издания зазеркалены локально).", "lg": "", "r": "", "cx": ""}, {"id": "M351", "src": "📒 мастер", "d": "", "t": "**Карточка равия перегружена** — нужна спокойная упорядоченная: Википедия · «все хадисы с ним» · «кто передаёт от него» (с ответвлениями) · переводы кнопкой у каждого слова учёных · доделанная читалка.", "s": "done", "v": "", "why": "✅ 🟡 карточка равия структурирована (вики/связи/ранги) — что упорядочить?", "lg": "", "r": "", "cx": ""}, {"id": "M352", "src": "📒 мастер", "d": "", "t": "**Правило: строить с расчётом на iPhone/Android/планшеты** (адаптивность, тач, производительность). → внесено как R36 в ПРАВИЛА.md.", "s": "done", "v": "", "why": "✅ правило", "lg": "", "r": "", "cx": ""}, {"id": "M353", "src": "📒 мастер", "d": "", "t": "**Плеер Корана «засыпает» при сворачивании Telegram** — поиграет и отключается, включить можно только зайдя обратно. Исследовать: Media Session API / ограничения WebView.", "s": "done", "v": "", "why": "✅ ✅ Подтверждено С56 (код-улика, отчёт в scratch_marathon/).", "lg": "", "r": "✅ реестр-аудит-2 С56: Media Session", "cx": ""}, {"id": "M354", "src": "📒 мастер", "d": "", "t": "**Кнопка «свернуть» НА ЧИТАЛКЕ Корана**.", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: кнопка «свернуть» читалки Корана miniMin → _miniCollapsed (стр.10043/10067)", "lg": "", "r": "", "cx": ""}, {"id": "M355", "src": "📒 мастер", "d": "", "t": "**Классные карточки хадиса (как в читалке сборника) должны быть ВЕЗДЕ**, не только в «ещё → читать сборник» (= M343: номерной поиск с полными карточками в каноническом порядке, версии a/b).", "s": "done", "v": "", "why": "✅ 🟡 makeCard даёт карточки везде (cardHadith/Ayah/Muh) — где конкретно не как в читалке?", "lg": "", "r": "", "cx": ""}, {"id": "M356", "src": "📒 мастер", "d": "", "t": "**«Продолжить читать Коран где остановился» — нет** (в книгах позиция помнится, в Коране нет).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: «продолжить чтение» cfg.qrLast — последняя сура+аят (стр.2829/10182)", "lg": "", "r": "", "cx": ""}, {"id": "M357", "src": "📒 мастер", "d": "", "t": "🚑 **Читалка Корана не крутится пальцем по аятам** — палец скроллит ЗАДНИЙ ФОН, читалка стоит (читать можно только «крутилкой»).", "s": "done", "v": "", "why": "✅ v322", "lg": "", "r": "", "cx": ""}, {"id": "M358", "src": "📒 мастер", "d": "", "t": "**Мини-плеер показывать ТОЛЬКО когда читалка Корана свёрнута** (не поверх открытой читалки — там свои кнопки).", "s": "done", "v": "", "why": "✅ v322", "lg": "", "r": "", "cx": ""}, {"id": "M359", "src": "📒 мастер", "d": "", "t": "**Пинч-зум шаджары**: увеличивать/уменьшать дерево двумя пальцами, всегда включено именно для шаджары (+ кнопки ⊖⊕ для ПК). Одобрено Claude: да, для широкой схемы это правильный инструмент.", "s": "done", "v": "", "why": "✅ v324", "lg": "", "r": "", "cx": ""}, {"id": "M360", "src": "📒 мастер", "d": "", "t": "🚑 **«Хадисы с его участием» захватывает ЧУЖИХ по куску слова** («هشام» → Хишам ад-Даставаи в معاذ بن هشام вместо Хишама ибн Аммара): поиск участия должен идти квалифицированно — точной фразой полной формы имени + (Э1.1) сверкой соседей по цепочке, НЕ подстрокой.", "s": "done", "v": "", "why": "✅ v325 (b → Э1.1)", "lg": "", "r": "", "cx": ""}, {"id": "M361", "src": "📒 мастер", "d": "", "t": "**Подсказки передатчиков**: ① имена с ОГЛАСОВКАМИ (в базе их нет → пайплайн батч-огласовки имён через ИИ с кэшем narrators_voc.json, поэтапно с топа известности) ② слева ровной колонкой минимальные данные (вафат/ранг; рождение+место — в базе пока нет, добавить датасетом).", "s": "done", "v": "", "why": "✅ ✅ Подтверждено С56 (код-улика, отчёт в scratch_marathon/).", "lg": "", "r": "✅ реестр-аудит-2 С56: narr_voc", "cx": ""}, {"id": "M362", "src": "📒 мастер", "d": "", "t": "🚑 **Номерной поиск медленный** («долго грузится»): канонические сборники строить МГНОВЕННО из локальных изданий (тексты уже у нас!), а turath-поиск пусть дополняет Мактабу ниже; кэш страниц.", "s": "done", "v": "", "why": "✅ v326", "lg": "", "r": "", "cx": ""}, {"id": "M363", "src": "📒 мастер", "d": "", "t": "🚑 **«Криво» в полной карточке**: в текст попадают СНОСКИ Шамелы («(تعليق الشاملة)», «قال ابن حجر в الفتح…», [ر: ٤٩٠٩], линия ______) — чистить хвост сносок из текста карточки.", "s": "done", "v": "", "why": "✅ v326", "lg": "", "r": "", "cx": ""}, {"id": "Э1.1", "src": "📒 мастер", "d": "", "t": "**ПРИКАЗ владельца: дизамбигуация ОБЯЗАТЕЛЬНА** — минимум все 40 первоисточников + Табари, лучше весь необходимый круг (кутуб ас-сунна). Механизм придумать самому; сначала исключить точь-в-точь повторы (не двойная работа). → запускаю офлайн-пайплайн disambig_isnads.py: дедуп exact-сегментов → 1-й проход: однозначные полные формы → таблица пар учитель↔ученик (+144k سماع) → 2-й проход: короткие форм", "s": "progress", "v": "", "why": "🟡 v1", "lg": "", "r": "", "cx": ""}, {"id": "M364", "src": "📒 мастер", "d": "", "t": "**Отметка «нестандартная нумерация»**: №5590 в печати السلطانية — другой хадис (не о музыке) → сравнивать текст печати со СТАНДАРТНЫМ изданием №N и вешать бейдж «⚠️ № печати ≠ стандартному».", "s": "done", "v": "", "why": "✅ v327", "lg": "", "r": "", "cx": ""}, {"id": "M365", "src": "📒 мастер", "d": "", "t": "**Скрывать доп. издания одного первоисточника** в номерном поиске (оставляя стандартное) — тумблер.", "s": "done", "v": "", "why": "✅ v327", "lg": "", "r": "", "cx": ""}, {"id": "M366", "src": "📒 мастер", "d": "", "t": "**Серверный буфер-предзагрузка** (принцип оперативки): bot.py прогревает соседние страницы книги (LRU + prefetch pg±N) — листание и карточки быстрее; не грузить 9000 книг, просчитывать минимум.", "s": "done", "v": "", "why": "✅ ждёт Redeploy", "lg": "", "r": "", "cx": ""}, {"id": "M367", "src": "📒 мастер", "d": "", "t": "✅ v327 — Перевод/Огласовки/Arabus у шапки биографии равия.", "s": "done", "v": "", "why": "✅ v327", "lg": "", "r": "", "cx": ""}, {"id": "M368", "src": "📒 мастер", "d": "", "t": "✅ v327 — 68 809 хадисов 11 первоисточников шардами на Pages (вкл. Табари): мгновенные карточки без сети-поиска.", "s": "done", "v": "", "why": "✅ v327", "lg": "", "r": "", "cx": ""}, {"id": "M369", "src": "📒 мастер", "d": "", "t": "✅ v328 — перевод под каждой цитатой досье.", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M371", "src": "📒 мастер", "d": "", "t": "✅ v328 — единый хронологический порядок критиков (ранние первыми) в чипах и цитатах.", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M372", "src": "📒 мастер", "d": "", "t": "✅ v328 — печати скрыты по умолчанию, «▸ другие печати (N) · ⚠️ есть отличия». ⏰ НАПОМИНАНИЕ владельцу: определить СТАНДАРТНОЕ издание для каждого из 40 первоисточников вкл. Табари (сейчас стандарт = наши локальные издания канона + шамела-печати остальных).", "s": "done", "v": "", "why": "✅ (+напоминание)", "lg": "", "r": "", "cx": ""}, {"id": "M370", "src": "📒 мастер", "d": "", "t": "🟡 PushNotification подключён: уведомление на ПК всегда, на айфон — при включённом Remote Control в приложении Claude (включи в настройках Claude app). Шлю в конце больших ходов.", "s": "progress", "v": "", "why": "🟡", "lg": "", "r": "", "cx": ""}, {"id": "M373", "src": "📒 мастер", "d": "", "t": "**Манифест PDF**: ① прочитан ✅ ② → канал @muslimoonapp (бот sendDocument при рестарте, пакет Redeploy) ③ в приложение: пункт «⚖️ О программе · Манифест» (зачаток главы «О программе»).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: манифест в приложении (PDF.js) + пункт «О программе» manifestRow (стр.10184)", "lg": "", "r": "", "cx": ""}, {"id": "M374", "src": "📒 мастер", "d": "", "t": "**Отметка конца первоисточников** в номерном поиске: разделитель «дальше — НЕ первоисточники».", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M375", "src": "📒 мастер", "d": "", "t": "**R39: перевод привязан к оригиналу** — в карточке хадиса перевод вставлялся в конец (после дерева/инструментов) → вставлять СРАЗУ под арабским текстом.", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M369b", "src": "📒 мастер", "d": "", "t": "поправка владельца: НЕ отдельные кнопки у цитат — ОДНА кнопка «Перевод», но результат раскладывается ПОД КАЖДОЙ цитатой.", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M376", "src": "📒 мастер", "d": "", "t": "🚑 **«أبو عامر أو أبو مالك» — это شك الراوي**, а не одна личность: дерево/опознание должны сплитить «X أو Y» и опознавать ОБОИХ, узел = «сомнение равия между двумя».", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M377", "src": "📒 мастер", "d": "", "t": "🚑 **Ф-04б двусторонний матч имён**: иснад даёт имя ДЛИННЕЕ базы (с нисбой: عبد الرحمن بن غنم الأشعري، عطية بن قيس الكلابي) → матчить и «имя базы = префикс запроса» (длиннейшее, ≥2 слов). Фронт + пайплайн Э1.1.", "s": "done", "v": "", "why": "✅", "lg": "", "r": "", "cx": ""}, {"id": "M378", "src": "📒 мастер", "d": "", "t": "**U-КОДЫ КАЖДОМУ (приказ): любой передатчик каждого хадиса 40 первоисточников имеет ID** — опознанные = id базы 18989; НЕопознанные формы получают НАШ к
