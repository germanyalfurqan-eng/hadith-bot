ом «(+N) с прошлого поста», отдельной строкой «ЗА ЭТОТ ЧАС ДОБАВИЛОСЬ», а когда парк стоит, уходит другой отчёт, прямо говорящий: это не копия, цифры действительно не двигались. Трата и остаток DeepSeek тоже на месте. ЧЕГО НЕ ХВАТАЛО — ЧЕТВЁРТОГО ВАШЕГО СЛОВА, «ВОЗОБНОВЛЕНИЯ»: человек видит «осталось мало» и не знает, ждать ему час или до завтра. Добавил строку: «♻️ Бесплатный дневной счёт: N из ~2500 · обнулится в 00:00 МСК (через X ч Y мин)» — и в рабочий отчёт, и в отчёт о простое. Считается по НАШЕМУ дневному счёту (тому самому, что бот показывает подписью «осталось ~N из ~2500»); он обнуляется в полночь по часам сервера, а часы сервера я сверил со своими (прод: 19:35 МСК, у меня 19:36). Чужие лимиты провайдеров туда не пишу: правила у каждого свои, а выдумывать час обновления в отчёте о числах нельзя. И ГЛАВНОЕ, ПОЧЕМУ ЭТО РАНЬШЕ НЕ ДЕЛАЛОСЬ: отчёт нельзя было увидеть иначе, как отправив вам. Завёл пробу — «python report_ai_state.py --проба» печатает отчёт в терминал и никому ничего не шлёт (заслон от повторов проба обходит, иначе текст не увидеть именно тогда, когда его надо смотреть). Проверено живьём: строка возобновления вышла верно (20 из ~2500, через 4 ч 22 мин). ⚠️ Рабочий вид отчёта увижу на первом же прогоне после запуска конвейера — сейчас парк стоит 754 часа, и та ветка не рисуется.", "cx": ""}, {"id": "#565", "src": "🤖 бот", "d": "13.07.2026 19:43 МСК", "t": "Че за проект ислам список сахабов ты что голову потерял? Это говорит о том что нужно немедленно ревизия ты можешь это понять? Обеспечь грамотную ревизию", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/565.json", "s": "done", "v": "проверено на боевом v1526", "why": "", "lg": "че за Проект:Ислам/Список сахабов в имени равия", "r": "Владелец был прав, и возмущение справедливо: в карточке равия №1702 (حي بن يؤمن المعافري) вместо русского имени стояло «≈ Проект:Ислам/Список сахабов» — заголовок СЛУЖЕБНОЙ страницы Википедии, затесав ет меня».\n\nКак видите, в одних аятах «шифа» — это духовное очищение, а в других — прямое указание на физическое здоровье (мед) или общая мольба о выздоровлении.»...\n— коммент владельца: почему ты не подписываешь источник? Это ии или что это? (из чата @jamaat_ru)", "corr": "", "img": false, "imgurl": "", "s": "done", "v": "v1370", "why": "", "lg": "", "r": "Точный корень выведен ОТДЕЛЬНЫМ блоком над обычной выдачей: «🌳 Корень شفي — 6 аятов · по разбору учёных, а не по буквам», с формами (شفاء имя ×4, يشف глагол ×2). Число владельца сошлось точно. Почему раньше выходило 12: режим «Однокоренные» ищет по СОГЛАСНОМУ СКЕЛЕТУ, а скелет ش-ف накрывает три разных корня — ش-ف-ي исцеление (9:14, 10:57, 16:69, 17:82, 26:80, 41:44), ش-ف-و край (3:103, 9:109) и ش-ف-ع заступничество (2:255, 4:85, 7:53, 21:28). Скелет НЕ тронут: в хадисах морфологического разбора нет, там он единственный способ искать однокоренное, — поэтому добавили, а не заменили. Проверено в браузере на живой сборке: блок появляется, в нём ровно 6 аятов, широкая выдача осталась ниже.", "cx": ""}, {"id": "#625", "src": "🤖 бот", "d": "19.07.2026 23:46 МСК", "t": "сверху линия не работает странная вообще она\n\nЗагрузка анимация в карточке передатчика абсолютно не работает криво строится дергается когда достанаиваетчч \n\nКогда я в web приложение с экрана домой включаю приложение то там нету звука интро \n\nДа оно должно зависеть от режима без звука или со звуком у телефона как я тебя просил но у меня беззвучный не стоял", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/625.json", "s": "done", "v": "закрыто в живом журнале", "why": "", "lg": "", "r": "v1174: скелетон карточки равия снимается плавно, ушла резкая «верхняя линия».", "cx": ""}, {"id": "#626", "src": "🤖 бот", "d": "20.07.2026 01:21 МСК", "t": "📚 Похоже, это книга из каталога Мактабы — открыть №1339:\n(если не та — выбери из кандидатов ниже)\n— коммент владельца: почему не даешь хадис? К 7.2026 06:26 МСК", "t": "а где тут поиск раг? И ты настроил вообще раг нужно же проверять на каждой книге\n\nЛимиты чтобы контекст вмешался контекст лимиты вывод возможности нужноттьесеечить проверку каждой книги на предмет поиска и вводить раг там где проверено начни с 9 кутуб и обеспечь там поиск раг полноценный не хуже чем ноутбук лм и скажи сколько там надо лимит контекста потянут ли наши апи и так далее", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/646.json", "s": "done", "v": "проверено на боевом 30.08.2026", "why": "", "lg": "этот поиск не обман? какой раг, если чанки не готовы", "r": "Проверено ЗАМЕРОМ на боевом бэкенде 30.08.2026, а не заверением. Поиск НЕ обман: /api/rag_find отвечает «база_загружена: true, векторов: 14344, режим: numpy», то есть чанки готовы и поиск идёт по векторам, а не по словам. Три проверки со смыслом, но без буквальных совпадений: «что делать при затмении солнца» → Бухари 1047, 3203, 1058 (все про затмение); «награда тому кто поит водой животное» → 6009 (тот самый хадис про собаку и жажду), 5480, 3325; «земной поклон за невнимательность в молитве» → 4863, 1078, 1230 (сужуд ас-сахв). Слов запроса в текстах нет — значит работает именно смысл. Время: загрузка базы 2,7 с (разово), сам поиск 0,7–1,7 с. ЧЕСТНАЯ ГРАНИЦА, о которой надо знать: размечен ТОЛЬКО Сахих аль-Бухари (14 344 фрагмента), остальные сборники не размечены и по ним смысловой поиск не работает — это написано и в справке РАГ в самом приложении. И НАЙДЕНА ОТДЕЛЬНАЯ БЕДА, вынесена в новую работу: у поиска есть порог сходства, растущий для коротких вопросов, и естественно заданный вопрос его не проходит. «как поступить если забыл сколько ракатов совершил» — ближайшее 48% при пороге 52%, ответ «ничего не найдено»; «забыл сколько ракатов» — 54% при пороге 55%, отказ по одному пункту. Тот же смысл, сказанный описанием («земной поклон за невнимательность в молитве»), находит три хадиса. То есть ответ в базе ЕСТЬ, а человек получает пустоту — и именно это выглядит как «обман».", "cx": ""}, {"id": "#647", "src": "🤖 бот", "d": "25.07.2026 06:29 МСК", "t": "Заявка а где тут поиск раг? И ты настроил вообще раг нужно же проверять на каждой книге\n\nЛимиты чтобы контекст вмешался контекст лимиты вывод возможности нужноттьесеечить проверку каждой книги на предмет поиска и вводить раг там где проверено начни с 9 кутуб и обеспечь там поиск раг полноценный не хуже чем ноутбук лм и скажи сколько там надо лимит контекста потянут ли наши апи и так далее\n— коммент владельца: вот например гпт как советует сделать как раг\n\nЕсли цель — сделать свою локальную “Мактабу”, где ИИ отвечает только на основе хадисов и умеет находить их очень точно, то я бы строил систему поэтапно.\n\n\n⸻\n\n\nЭтап 1. Собрать библиотеку\nНужно собрать все книги в чистом виде.\nНапример:\n/library/\n\n  /bukhari/\n      0001.json\n      0002.json\n      ...\n\n  /muslim/\n\n  /abudawud/\n\n  /tirmidhi/\n\n  /nasai/\n\n  /ibnmajah/\n\n  /muwatta/\n\n  /musnad_ahmad/\nКаждый хадис отдельно.\nНапример\n{\n  \"book\":\"Бухари\",\n  \"chapter\":\"Книга знания\",\n  \"number\":1,\n  \"arabic\":\"...\",\n  \"russian\":\"...\",\n  \"isnad\":\"...\",\n  \"grade\":\"Сахих\"\n}\n\n\n⸻\n\n\nЭтап 2. Разбить на чанки\nВекторная база не любит огромные документы.\nЛучше хранить\n1 хадис = 1 чанк\nили\n2–3 коротких хадиса = 1 чанк\n\n\n⸻\n\n\nЭтап 3. Создать эмбеддинги\nДля каждого хадиса вычисляется embedding.\nНапример\nхадис 1\n\n↓\n\nembedding\n\n↓\n\n[0.1234\n0.9384\n...\n]\nЭто делается один раз.\n\n\n⸻\n\n\nЭтап 4. Векторная база\nПодойдет\nChroma\nQdrant\nMilvus\nFAISS\nЯ бы выбрал Qdrant.\nОн:\nбыстрый;\nбесплатный;\nотлично работает локально;\nподдерживает миллионы записей.\n\n\n⸻\n\n\nЭтап 5.", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/647.json", "s": "done", "v": "проверено на боевом 30.08.2026", "why": "", "lg": "этот поиск не обман? какой раг, ом табличный вид. Прогрев зовёт всё разом, не по очереди — проверено. Оставляю в работе: жду слова владельца, стало ли терпимо, прежде чем идти на переделку табличного вида. 🔧 ПЕРЕМЕРЕНО И ПОЧИНЕНО 08.09.2026 (смена 90, v1617). Открыл ту же карточку (Катада, id 6289) на боевом и нашёл лишнюю работу: narrators_wiki.json приезжал ДВАЖДЫ — 477 КБ впустую на КАЖДОЕ открытие. Причина не в карточке, а в загрузчике: кэш ставился по готовому ответу, и вызовы, начавшиеся одновременно, все шли грузить заново. Чинил не этот случай, а класс: поиском по образцу нашлись ВСЕ четыре таких загрузчика (loadLakab, loadNarrFlags, loadNarrWiki, loadNarrWikiImg) и ни одного исправного — сторож поставлен всем. ДОКАЗАНО НА БОЕВОМ: девять одновременных вызовов дали ЧЕТЫРЕ запроса, каждый файл ровно один раз. Пост в канале #1517.", "cx": ""}, {"id": "#695", "src": "🤖 бот", "d": "02.08.2026 10:01 МСК", "t": "🔬 Расширенный: подобранные арабские фразы теперь КНОПКАМИ внизу, а не кашей в строке поиска. Нажал — выключил (гаснет и черкается), нажал ещё — вернул. Свою фразу можно дописать. Поиск идёт только по выбранным и только по кнопке. Заявка M103.\n\n———\n📲 Приложение: https://t.me/muslimoontt_bot?startapp\n🤖 Бот: https://t.me/muslimoontt_bot\n— коммент владельца: нарушение формата обновлений", "corr": "", "img": false, "imgurl": "", "s": "done", "v": "закрыто в живом журнале", "why": "", "lg": "", "r": "Комментарий владельца был «нарушение формата обновлений», а причина оказалась в ссылке: в подвале поста стояло t.me/muslimoontt_bot?startapp БЕЗ имени мини-аппа — такая ссылка открывает переписку с ботом, а не приложение. Аудит всех ссылок bot.py: 17 штук без «/app» (хадис r_<книга>_<номер>, передатчик n_<id>, номер Мухаймина m_<номер>, подвал каждого поста), одна правильная. Правильная форма была ЗАДОКУМЕНТИРОВАНА в том же файле у кнопки «Открыть Muslimoon». Выправлены все 17; голая ссылка на бота не тронута; dsoc_promt.md проверен — там уже было /app. Сама заявка M103 (фразы кнопками внизу) в приложении работает.", "cx": ""}, {"id": "#696", "src": "🤖 бот", "d": "02.08.2026 10:57 МСК", "t": "на каждое слово в Коране при выделении надо транскрипцию русскими буквами наверное лучше всего подумай", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/696.json", "s": "done", "v": "закрыто в живом журнале", "why": "", "lg": "", "r": "v1387 показывает звучание русскими буквами по тапу на слово (в Коране тоже — слова .qw идут через onWordTap → showWordPopup). v1390 исправил разбор артикля: проверено В ЖИВОМ приложении на боевом адресе, 22 слова из 22 верны, включая Аллахи, аллаз̱ӣна, биллахи, ар-рах̣ма̄ни, аш-шамсу, аль-кита̄би, биш-шамси.", "cx": ""}, {"id": "#697", "src": "🤖 бот", "d": "02.08.2026 11:04 МСК", "t": "Перевод минуту крутился так и не сделал\n\nСделай дипсик резервным чтобы например если за 30 секунд не ответили фри апи то тогда дипсик \n\nИ проследи чтобы все 24 апи были подключены к приложению и почему они не смогли его перевести по итогу\n\nКстати пусть пишет что лимиты не отвечают или проблема какая \n\nПлюс сделай также про таком случае кнопку предоставить апи \n\nТо есть человек если хочет помочь пусть дает апи и бот добавляет его в очередь апи по всему приложению\n\nВ таком случае мне обязательно надо доложить \n\nИ наверное мне надо в ручную же апи этот в райлвай бед меня вряд ли заработает да? \n\nТакой предоставленный апи нельзя нам тратить кроме как в приложении аманат", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/697.json", "s": "done", "v": "v1357", "why": "", "lg": "", "r": "Причина та же, что у #701: перевод падал NameError на первой строке. Починено, отвечает за 19 с настоящим русским текстом.", "cx": ""}, {"id": "#698", "src": "🤖 бот", "d": "04.08.2026 06:32 МСК", "t": "нейротахкик должен быть на виду а не свернут", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/698.json", "s": "done", "v": "v1356", "why": "", "lg": "", "r": "Блок нейротахкика собран как <details OPEN> — развёрнут по умолчанию, как и просили.", "cx": ""}, {"id": "#699", "src": "🤖 бот", "d": "05.08.2026 12:51 МСК", "t": "Почему сверху Бухара и муслим а внизу Коран про том что я общий поиск Даль", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/699.json", "s": "progress", "v": "закрыто в живом журнале", "why": "", "lg": "", "r": "Проверено на бою v1391 запросом «терпение»: Бухари первым (позиция 8020 в тексте выдачи), Коран ниже (22509). Причина не в сортировке: блок аята сверху (_блокАятСверху, v1386) требует ≥3 значимых слов И чтобы аят содержал их ВСЕ — однословный запрос его не поднимает. Заслон намеренный и задокументирован в коде: по 1–2 словам «подходящих» аятов десяток, наверх полезет чужой, а назвать не тот аят хуже, чем не назвать никакого (тот же класс, что ложные вики-привязки). Ослаблять без слова владельца не стал. Предложено: не трогая заслон, поставить НАД выдачей строку «📖 Искать это в Коране» — она ничего не утверждает про конкретный аят, но ставит Коран выше хадисов (Книга прежде Сунны). Жду решения.", "cx": ""}, {"id": "#700", "src": "🤖 бот", "d": "05.08.2026 13:07 МСК", "t": "Добавь это в правило достоверности в приложение наше \n\nИ добавь мне тут команду которую напрямую добавляет в правила достоверности (из чата @jamaat_ru)", "corr": "", "img": false, "imgurl": "", "s": "progress", "v": "v1532", "why": "", "lg": "добавь это в правила достоверности + команду, которая добавляет напрямую", "r": "ВТОРАЯ ПОЛОВИНА СДЕЛАНА И ПРОВЕРЕНА, ПЕРВАЯ ЖДЁТ ВАШЕГО ТЕКСТА. Вы просили две вещи. ① «Добавь мне тут команду, которая напрямую добавляет в правила достоверности» — есть: напишите боту «правило <текст>», и оно появится в приложении, в разделе «📜 Наука хадиса», блоком «📌 Правила владельца» вторым сверху. Выкатка приложения для этого не нужна: бот кладёт правило в ветку данных, приложение оттуда же читает. «правила» — посмотреть все, «правило убрать 3» — снять. Проверено в живом браузере ДО выкатки: с двумя правилами блок появляется и стоит вторым разделом; при недоступном файле и при пустом списке блока нет ВОВСЕ (а не пустой заголовок — это выглядело бы поломкой); ошибок в консоли ноль. ② «Добавь ЭТО в правило достоверности» — сделать нечем: в заявке стоит слово «это», а самого текста нет, вы показывали его отдельным сообщением. Гадать в правилах достоверности нельзя. Пришлите текст командой «правило …» — ляжет туда же, и заявку закрою.", "cx": ""}, {"id": "#701", "src": "🤖 бот", "d": "05.08.2026 16:51 МСК", "t": "📖 Сунан ан-Насаи, №851\n\n🔤 أَخْبَرَنَا هَارُونُ بْنُ زَيْدِ بْنِ أَبِي الزَّرْقَاءِ، قَالَ حَدَّثَنَا أَبِي قَالَ، حَدَّثَنَا سُفْيَانُ، ح وَأَخْبَرَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ حَدَّثَنَا قَاسِمُ بْنُ يَزِيدَ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَابِسٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنِ ابْنِ أُمِّ مَكْتُومٍ، أَنَّهُ قَالَ يَا رَسُولَ اللَّهِ إِنَّ الْمَدِينَةَ كَثِيرَةُ الْهَوَامِّ وَالسِّبَاعِ ‏.‏ قَالَ ‏\"‏ هَلْ تَسْمَعُ حَىَّ عَلَى الصَّلاَةِ حَىَّ عَلَى الْفَلاَحِ ‏\"‏ ‏.‏ قَالَ نَعَمْ ‏.‏ قَالَ ‏\"‏ فَحَىَّ هَلاً ‏\"‏ ‏.‏ وَلَمْ يُرَخِّصْ لَهُ ‏.‏\n\n🌍 It was narrated from Ibn Umm Maktum that he said:\"0 Messenger of Allah (ﷺ), there are many (dangerous) pests and wild animals in Al-Madinah.\" He said: \"Can you hear (the words) 'Come prayer, come to prosperity'?\" He said \"Yes.\" He said: \"Then be quick to respond,\" and he did not grant him a dispensation\n\n📊 Сахих ✅\n\n📲 [Открыть карточку в приложении](https://t.me/muslimoontt_bot?startapp=r_nasai_851)\n— коммент владельца: че за Английский тут русский где (из чата @jamaat_ru)", "corr": "", "img": false, "imgurl": "", "s": "done", "v": "v1357", "why": "", "lg": "", "r": "Перевод карточки был мёртв целиком (/api/translate падал NameError). Проверено живьём на ЭТОМ хадисе (Насаи 851): вернулся русский текст за 19 с.", "cx": ""}, {"id": "#702", "src": "🤖 бот", "d": "05.08.2026 16:52 МСК", "t": "слишком долго грузится ускорь", "corr": "", "img": true, "imgurl": "https://raw.githubusercontent.com/germanyalfurqan-eng/hadith-bot/data/req_img/702.json", "s": "done", "v": "v1373", "why": "", "lg": "", "r": "Три правки подряд по одному и тому же замеру (поиск по номеру «66» на боевом сайте): ① сборники больше не грузятся целиком ради одного хадиса — нарезаны по 200 номеров; ② убран тихий префетч hadith_ru.json (13 МБ на диске, ~3 МБ по сети) — он грел кэш, в который кнопка «Перевод» давно не заглядывает: она берёт один хадис с CDN; ③ markup/muslim_0.json ехал ДВАЖДЫ по 649 КБ — кэшируем обещание, как у codif (#497). Итог: было 10,98 МБ и 78 запросов, стало 6,4 МБ и ноль дублей. Это не «мгновенно», но втрое легче, и каждая цифра замерена, а не обещана. Осталось дробное (markup ~1,9 МБ, f40c, narr_disp) — отдельной работой.", "cx": ""}, {"id": "#703", "src": "🤖 бот", "d": "05.08.2026 20:06 МСК", "t": "🟩 [DSOC] подключить бесплатную озвучку Edge TTS (или аналогичную) для более живых голосовых ответов бота.", "corr": "", "img": false, "imgurl": "", "s": "done", "v": "закрыто в живом журнале", "why": "", "lg": "", "r": "Edge TTS подключён и стоит ПЕРВЫМ, а не запасным: в озвучить() сперва edge_tts.Communicate(...).save(), и только если он не дал файла больше 800 байт — падение на gTTS. Зависимость на сервере есть: requirements.txt, строка 9 «edge-tts» (gTTS строкой 6 как запасной). Голоса настроены: русский — мультиязычный en-US-AndrewMultilingualNeural (живее двух родных русских, владелец выбирает его сам обращениями #26/#28), арабский — ar-SA-HamedNeural всегда, потому что выбор касается манеры чтения по-русски, а не таджвида. Сейчас голос выключен рубильником по воле владельца (#320) — это не поломка.", "cx": ""}, {"id": "#704", "src": "🤖 бот", "d": "06.08.2026 12:21 МСК", "t": "🐞 НОВАЯ ОШИБКА A-223 (app v1293)\nahmad-full: Полная загрузка Ахмада (25  "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M54", "src": "📒 мастер", "d": "", "t": "Клик по «Коран X:Y» в результате → открыть ВСЮ суру (чтение), далее аудио + таджвид", "s": "done", "v": "", "why": "✅ v158 (чтение): `openQuranReader` — клик «📖 Коран · X:Y» → вся сура, прокрутка к аяту, перевод, навигация по сурам, Arabus. Осталось: аудио + таджвид.", "lg": "", "r": "✅ реальный агент (recall): v158 клик по Корану открывает суру [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M55", "src": "📒 мастер", "d": "", "t": "Нейро: понятно показывать, что «Подобрать» добавляет альтернативы (накопление, редактируемые блоки)", "s": "done", "v": "", "why": "🟡 индикатор «Подбираю…» + тост ✅; полный UI блоков 🔴", "lg": "", "r": "", "cx": ""}, {"id": "M56", "src": "📒 мастер", "d": "", "t": "Лимит результатов сейчас 200 (первые); сделать подгрузку «показать ещё»", "s": "done", "v": "", "why": "✅ v500", "lg": "", "r": "", "cx": ""}, {"id": "M57", "src": "📒 мастер", "d": "", "t": "Мукбиль — поиск по номеру работает (проверено)", "s": "done", "v": "", "why": "✅ v16", "lg": "", "r": "", "cx": ""}, {"id": "M59", "src": "📒 мастер", "d": "", "t": "**Реклама/подпись при копировании**: на каждое ⧉-копирование добавлять промо-футер (как myquran.me: текст + перевод + #хэштег + ссылка на апп/канал). Текст подписи согласовать.", "s": "done", "v": "", "why": "✅ v51: подпись «📗 Muslimoon — Коран и хадисы» + ссылка t.me/muslimoontt_bot/app; тумблер в ⚙️ Настройки (по умолчанию ВКЛ). Текст можно доработать.", "lg": "", "r": "✅ реальный агент (recall): v51 промо-подпись при копировании [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M117", "src": "📒 мастер", "d": "", "t": "**Мульти-перевод аята** на карточке: Кулиев / Абу Адель (переключение/добавление) + ИИ-перевод (построчный буквальный с этимологией, накопительный). Сейчас выбор перевода — в ⚙️ Настройки.", "s": "done", "v": "", "why": "✅ v491", "lg": "", "r": "", "cx": ""}, {"id": "M118", "src": "📒 мастер", "d": "", "t": "**Поиск в «Других сборниках» по автору/названию** + галочки «искать по автору» / «по названию книги» + **ИИ-кнопка «найти книгу своими словами»** (напр. «тафсир Табари» → предлагает издания, как Мактаба).", "s": "done", "v": "", "why": "✅ v500", "lg": "", "r": "", "cx": ""}, {"id": "M119", "src": "📒 мастер", "d": "", "t": "**Выделение иснад/матн/слов передатчика в РУССКОМ переводе** (как в арабском).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M73c", "src": "📒 мастер", "d": "", "t": "**Поиск по НАЗВАНИЯМ сур**: «корова» → если нужна сура аль-Бакара (не только аяты); связать EN/RU названия сур ↔ номер.", "s": "done", "v": "", "why": "✅ v490", "lg": "", "r": "", "cx": ""}, {"id": "M120", "src": "📒 мастер", "d": "", "t": "**ИИ-поиск дёргался на каждую букву** (трата ключа)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:2137 — _aiCache={} «кэш ИИ-подбора: повтор того же не тратит ключ», гейт перед запросом (2142).", "lg": "", "r": "✅ реальный агент (recall): v52 ИИ-поиск не на каждую букву [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M121", "src": "📒 мастер", "d": "", "t": "**Старт для чайников**: «Искать в:» свернуть по умолчанию; кнопки выбрать/снять все не мозолят глаза.", "s": "done", "v": "", "why": "✅ v52: свёрнуто (#colsToggle), внутри — основные + «Другие сборники».", "lg": "", "r": "✅ реальный агент (recall): v52 Искать в свёрнуто [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M122", "src": "📒 мастер", "d": "", "t": "**Тафсир/Шарх на аяте и хадисе**: кнопка → тафсир (Ибн Касир и др.) на аят; шарх (Ибн Хаджар и др.) на хадис; ПРИОРИТЕТ — НАШ тафсир «Ислам Камиль» (отметка «скоро»).", "s": "progress", "v": "", "why": "🟡 НАПОЛОВИНУ, проверено на боевом 08.09.2026 (смена 90, v1617). ТАФСИР НА АЯТЕ — ЕСТЬ и работает: позвал openTafsir(2,255) в живом приложении, загрузились данные аята и our_tafsir.json, отрисовалось 32 575 знаков, на экране модалка с ШЕСТЬЮ муфассирами — Ибн Касир, Табари, Саади, Мухтасар, Куртуби, Багави, плюс оригинал/перевод/копировать. ШАРХА НА ХАДИСЕ НЕТ: функции openSharh/showSharh в приложении не существует вовсе (слова «шарх» в коде встречаются как имена книг и людей, а не как возможность). ⚠️ Путь ко второй половине открыт: sunnah.one отдаёт у каждой карточки поле sharh_id, и у него есть дверь ?action=sharh&id=N — проверил, отвечает готовым разбором. То есть шарх можно взять оттуда же, откуда берём хадис", "lg": "", "r": "", "cx": ""}, {"id": "M123", "src": "📒 мастер", "d": "", "t": "**Аудио Корана**: чтец **Ali al-Hudhaifi по умолчанию** + выбор чтеца в Настройках (everyayah поаятно).", "s": "done", "v": "", "why": "✅ v491", "lg": "", "r": "", "cx": ""}, {"id": "M124", "src": "📒 мастер", "d": "", "t": "**«Расширенный»/ИИ**: при правке ИИ-фраз явно показывать «сейчас будет НОВЫЙ запрос к ИИ» (чтобы не тратить нечаянно).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:308 — кнопка id=\"neuroRun\" «Подобрать (ИИ)» с предупреждением про новый запрос.", "lg": "", "r": "✅ реальный агент (recall): v243 предупреждение перед ИИ [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M125", "src": "📒 мастер", "d": "", "t": "**Десктоп**: адаптивная ширина окна (оптимально на ПК).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:55-56 — @media(min-width:1024px)/1500px расширяют .wrap на ПК/планшете, комментарий «M125».", "lg": "", "r": "", "cx": ""}, {"id": "M126", "src": "📒 мастер", "d": "", "t": "**Нумерованные посты (фетвы/ответы)** — раздел для наших нумерованных разборов/ответов. Название обсуждается (Фетвы/Ответы/Разборы/База ответов).", "s": "progress", "v": "", "why": "🟡 v53: заглушка «📌 Фетвы и ответы (нумерованные) — скоро» в ☰ Ещё.", "lg": "", "r": "", "cx": ""}, {"id": "M127", "src": "📒 мастер", "d": "", "t": "**Большой каталог книг (Мактаба-стиль)**: ввод «Табари»/«Альбани» → его книги → искать/читать. Сейчас 16 книг. Нужен каталог сотен книг (имена+id) + загрузка с shamela/turath по запросу. **Разведка 06-06:** turath/shamela закрыты (CORS/403) → тянуть через наш `/api`-прокси; готового списка книг публично нет (собирать самим); **sunnah.one** (turath-движок) через прокси даёт широкий поиск + хукм + ت", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M111+", "src": "📒 мастер", "d": "", "t": "**Избранное/недавние книги в «Других»**: книги, которые юзер добавил/читал — СОХРАНЯТЬ и поднимать ВВЕРХ списка (быстрый выбор, персонально, localStorage).", "s": "done", "v": "", "why": "✅ ✅ v628: НЕДАВНО ЧИТАЛ — книги, что юзер открывал в читалке, авто-сохраняются (localStorage recent_books, свежие первыми, до 20) → раздел «🕐 Недавно читал» в каталоге Мактабы (рядом с «⭐ Моё избранное»). Избранное книг (ручное ⭐) уже было. Проверено в живом браузере: openBook→_pushRecentBook (1681 всплывает наверх без дублей), фильтр __recent__ показывает Сахих Бухари строкой, 0 ошибок.", "lg": "", "r": "", "cx": ""}, {"id": "M129", "src": "📒 мастер", "d": "", "t": "**NotebookLM-стиль: вопрос ПО КОНКРЕТНОЙ книге** (RAG): выбрал книгу/источник → задал вопрос своими словами → ИИ отвечает ТОЛЬКО по тексту этой книги (с цитатами/номерами). Реализация: матч релевантных отрывков из книги → передать ИИ как контекст → ответ со ссылками. (обсудить, накопительно)", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО, проверено на боевом 08.09.2026 (смена 90). Функции «спросить по выбранной книге» в приложении НЕТ: ни ragAsk, ни askBook, ни чего-либо подобного (перебрал всё окно приложения — нашлись только браузерные ondrag*). Папка ./rag/ существует и РАГ работает, но по своду в целом, а не «выбрал книгу → спросил её». ⚠️ И честное предупреждение из соседнего замера: читать всю базу на каждый вопрос нельзя (171 550 мест — это сутки на один вопрос), значит нужен указатель по КАЖДОЙ книге отдельно, а не общий. Это работа, а не настройка", "lg": "", "r": "", "cx": ""}, {"id": "M128", "src": "📒 мастер", "d": "", "t": "**ДИЗАЙН-РЕВЬЮ + МАКЕТ (GPT) — визуальная цель, обсудить и применить (8→9.5):** ЕСТЬ ГОТОВЫЙ МАКЕТ главной (скрин 06-06). Элементы: подзаголовок «Исламская библиотека в твоём кармане»; **строка статистики** (120 000+ хадисов В· 6 236 аятов В· Последнее обновление + дата); **рџ\"Ќ внутри поля + круглая кнопка поиска справа**; «По смыслу (ИИ)» выделен фиолетовым; блок **«Быстрые действия»** (🔥 Популя", "s": "done", "v": "", "why": "🔴 продумать/применить", "lg": "", "r": "на главной слоган из макета «Исламская библиотека в твоём кармане» вместо технической строки (и в EN).", "cx": ""}, {"id": "M60", "src": "📒 мастер", "d": "", "t": "**Накопительная самообучаемость** (важно!): сначала ИИ помогает (нейро-фразы, перевод), потом мини-апп/бот **сам накапливает** найденное и отвечает БЕЗ обращения к ИИ. Переводы уже копятся (`translations.json`→ветка `data`); добавить кэш нейро-подборов (запрос→удачные арабские фразы) + переиспользование. (=развитие M51/B8)", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M61", "src": "📒 мастер", "d": "", "t": "Анимация-заставка (splash) перед запуском мини-аппа. «Подумаем потом».", "s": "done", "v": "", "why": "🔴 идея", "lg": "", "r": "Реализовано ранее (v1151): интро-заставка при запуске — видео-лого + звук + голос + вибро, тумблеры в Настройках (mn_i_video/sound/voice/vibro), раз за сессию, тап-скип, reduced-motion пропускает.", "cx": ""}, {"id": "M63", "src": "📒 мастер", "d": "", "t": "**Главный рубильник «🌐 ВСЁ ВСЕМ»**: один тумблер сверху панели → все функции (вход/перевод/нейро/ботяра) открыты КАЖДОМУ в личке и группах; выключил → возврат к точечным настройкам.", "s": "done", "v": "", "why": "✅ v20 (`all.public`); 49/49 тестов", "lg": "", "r": "✅ реальный агент (recall): v20 рубильник ВСЁ ВСЕМ [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "B15", "src": "📒 мастер", "d": "", "t": "* شكيЩ\" через ИИ, с ЯСНОЙ пометкой «делает ИИ, возможны ошибки (не автор)». Накопительно (один раз — сохранили).", "s": "done", "v": "", "why": "✅ v33 (проверено)", "lg": "", "r": "✅ реальный агент (recall): кнопка Огласовки нейронкой [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M70", "src": "📒 мастер", "d": "", "t": "**Обратная связь + «указать на ошибку»** на каждом хадисе/аяте: юзер пишет коммент где ошибка → попадает в **«рабочий стол разработчика»** в мини-аппе (owner видит список); кнопка «🧠 ИИ-разбор» шлёт в DeepSeek с контекстом поста (что за хадис, где ошибка) → owner смотрит как исправить. Галочка «добавить помощников» (могут предлагать правки, но строгое одобрение owner). + модерация на наплыв.", "s": "done", "v": "", "why": "✅ есть", "lg": "", "r": "", "cx": ""}, {"id": "M71", "src": "📒 мастер", "d": "", "t": "Справка **«ⓘ что значит вкл/выкл»** у каждой настройки доступа.", "s": "done", "v": "", "why": "✅ v23", "lg": "", "r": "✅ реальный агент (recall): справка вкл/выкл [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M66", "src": "📒 мастер", "d": "", "t": "**Выделение матна** ярче иснада/комментария: матн в «…» — белый жирный; иснад — серый; комментарий — обычный. Доработать детект комментария (хадис صحيح/أخرجه…) отдельным стилем.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "✅ реальный агент (recall): подсветка иснада цветом [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M67", "src": "📒 мастер", "d": "", "t": "**Кнопка «🔎 Найти первоисточники»**: по матну хадиса найти его в сборниках/dorar/sunnah → показать التخريج (какой сборник, №, достоверность). Накопительно (кэш найденного). Реализация: dorar/sunnah API (`/api/search` уже есть) + матч по матну.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M68", "src": "📒 мастер", "d": "", "t": "**Лайки/дизлайки + обратная связь + комментарии** к каждому хадису/аяту, ": "✅ v28", "lg": "", "r": "", "cx": ""}, {"id": "M85", "src": "📒 мастер", "d": "", "t": "**🛠 Рабочий стол справа от ⚙️** (чтоб другие разработчики не тыкали случайно) + **YouTube вниз** меню «Ещё» (сначала функции, реклама — потом).", "s": "done", "v": "", "why": "✅ v28", "lg": "", "r": "✅ реальный агент (recall): v28 рабочий стол справа [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M86", "src": "📒 мастер", "d": "", "t": "**Поддержка проекта (донаты)** — на оплату Railway + DeepSeek + др. Варианты: Telegram Stars ⭐ / TON-кошелёк / внешняя ссылка. Нужны: выбор способа + кошелёк/реквизиты владельца.", "s": "open", "v": "", "why": "🔴 НЕ НАЧАТО. Проверено на боевом 08.09.2026 (смена 90): слов «донат», «поддержать», «поддержка проекта», «Telegram Stars» в приложении НЕТ ни одного. Раздела нет, заглушки нет. ⚠️ И то, что решать вам, а не мне: приём денег — это не кнопка, а обязательства (кому платит человек, кто отвечает, что показываем в отчёте). Начинать стоит с вашего решения об этом, а не с вёрстки", "lg": "", "r": "", "cx": ""}, {"id": "M87", "src": "📒 мастер", "d": "", "t": "**Аналитика**: что ищут чаще всего (умный поиск — накопительно), статистика пользования аппом, просмотры каждого результата. (=G3 + M51)", "s": "done", "v": "", "why": "✅ v32", "lg": "", "r": "", "cx": ""}, {"id": "M88", "src": "📒 мастер", "d": "", "t": "**Реорганизация настроек**: вкладки «функции бота» vs «настройки»; перенести управление доступом в рабочий стол.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "✅ реальный агент (recall): аналитика поиска [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M89", "src": "📒 мастер", "d": "", "t": "**Кабинет разработчика** (переименован с «Рабочий стол»): журналы списком (📚Накопление В· 🧠Расход ИИ · 💬Отзывы · 🆕Обновления) → нажал → внутри последние записи; расширенные рабочие ссылки спрятаны (сворачиваются).", "s": "done", "v": "", "why": "✅ v29", "lg": "", "r": "", "cx": ""}, {"id": "M90", "src": "📒 мастер", "d": "", "t": "**Однокоренные** + помощник форм. (а) переключение режима сразу пересчитывает (v29). (б) **Помощник форм**: при «однокоренных» показываю список найденных форм со счётчиками (الحكم 2 · حكم 1 · حكمة …), клик = оставить одну форму (как corpus).", "s": "done", "v": "", "why": "✅ v30", "lg": "", "r": "✅ реальный агент (recall): v29 кабинет разработчика [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M73b", "src": "📒 мастер", "d": "", "t": "**Хадисы по-русски — ГОТОВЫЕ переводы есть!** rus-bukhari(7590)/rus-muslim/rus-abudawud в hadith-api. v38: кнопка «Перевод» для них берёт **готовый проф. перевод мгновенно, без ИИ/траты ключа**. Осталось: **русский ПОИСК по хадисам** — забрать эти rus-издания (как quran_ru) и искать по русскому тексту. Тирмизи/ИбнМаджа/Насаи/Малик рус-издания пока нет (ИИ+накопление).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "✅ реальный агент (recall): v38 готовые переводы без ИИ [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M91", "src": "📒 мастер", "d": "", "t": "**Мультивыбор форм/ИИ-фраз**: в «Однокоренных» и «По смыслу (ИИ)» — нажал форму/фразу = выделил (показывает только её), нажал ещё = добавил, нажал снова = снял. Панель НЕ пропадает (без перехода с потерей вариантов).", "s": "done", "v": "", "why": "✅ v34", "lg": "", "r": "✅ реальный агент (recall): v34 мультивыбор форм [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M92", "src": "📒 мастер", "d": "", "t": "БАГ: перевод тратил ключ дважды на один хадис → фикс (берём из файла-сборника по номеру, без DeepSeek).", "s": "done", "v": "", "why": "✅ v34 (см. ЗАМЕЧАНИЯ №11)", "lg": "", "r": "✅ реальный агент (recall): v34 баг двойной траты ключа [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M93", "src": "📒 мастер", "d": "", "t": "**Уведомления об обновлении — с содержанием** (что именно поменяли, простым языком), а не только факт. Через `update_note.txt`, бот постит на старте.", "s": "done", "v": "", "why": "✅ v34", "lg": "", "r": "✅ реальный агент (recall): v34 уведомления обновления [спот-чек: M59/M63/M81 подтверждены кодом]", "cx": ""}, {"id": "M94", "src": "📒 мастер", "d": "", "t": "На телефоне «Однокоренные» не показывает панель форм (в превью показывает). Проверить на v34; если повторится — собрать детали (версия в шапке, шаги).", "s": "done", "v": "", "why": "✅ v501", "lg": "", "r": "", "cx": ""}, {"id": "M96", "src": "📒 мастер", "d": "", "t": "В Коране при вводе числа — подсказка-помощник: «сура N, в ней до X аятов» (помощь в наборе сура:аят).", "s": "done", "v": "", "why": "✅ v49 (qHelper: N→сура+аяты; N:M→валидация «столько аятов нет»/«114 сур»)", "lg": "", "r": "", "cx": ""}, {"id": "M111", "src": "📒 мастер", "d": "", "t": "**«Искать в:» — свернуть + «мои актуальные сборники» (избранное).** По умолчанию чипы свернуть под кнопку «Искать в», внутри — список актуальных книг пользователя. Можно ДОБАВЛЯТЬ (из «Других сборников») и УБИРАТЬ неудобные (напр. убрать Бухари). Нужна наглядная кнопка «убрать из избранного». Со временем — автоподбор актуальных.", "s": "done", "v": "", "why": "✅ v491", "lg": "", "r": "", "cx": ""}, {"id": "M112", "src": "📒 мастер", "d": "", "t": "**«Другие сборники» — поисковая строка по МНОГИМ книгам** (как Мактаба: вводишь «Ибн Хаджар» → его книги → выбираешь) + **кнопка выбора автора**. Сейчас фильтр по 16 нашим; нужен большой каталог (= M44+ добор книг).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M113", "src": "📒 мастер", "d": "", "t": "**«Как искать» — для чайников**: понятные примеры/анимация. Строку под поиском упростил (v49), операторы в модал. Доработать модал примерами/анимацией.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M97", "src": "📒 мастер", "d": "", "t": "**Иснад / матн / слова передатчика — РАЗНЫМИ ЦВЕТАМИ через ИИ** + накопление в наш сборник (раз сделали — навсегда) + кнопка недоступна, если уже размечено (не тратить ключ). Кнопка отличается цветом.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M98", "src": "📒 мастер", "d": "", "t": "**Онбординг-подсказки**: выплывающие закрываемые хинты на каждую функцию (как в CapCut/первый запуск творческой студии) — «что это и что можно делать». + кнопку **«↩ вернуть» (undo/отмена)** подсветить, чтобы знали о ней.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M44+", "src": "📒 мастер", "d": "", "t": "**ВСЕ книги Мактабы** (сотни-тысячи, не только ~30 скачанных): базовый поиск по умолчанию + кнопка «вћ• добавить все книги Мактабы» + выбор книги. ~30 локально (`editions/local-*.json`), остальное — shamela.ws/turath.io + парсер.", "s": "progress", "v": "", "why": "🟡 v44: кнопка «вћ• Другие сборники» + 16 готовых книг (Ибн Аби Шейба, Ибн Хиббан, Дарими, Абу Я'ля, Насаи-Кубра, Ибн Хузайма, Таялиси, Исхак, Хумайди, Адаб аль-Муфрад, Абу Авана, Ибн аль-Джа'д, Абд ибн Хумайд, Исмаил, Ибн аль-Мубарак, аль-Джихад) с поиском по автору; издания в `docs/editions/`. **+v111: 40 Навави / Хадисы Кудси / 40 ад-Дехлеви** (тематические «сорок», грузятся с CDN fawazahmed0, `cdn:true`). Осталось: добрать остальные сотни книг с shamela/turath.", "lg": "", "r": "", "cx": ""}, {"id": "M67b", "src": "📒 мастер", "d": "", "t": "اЩ\"تخريج «Где ещё» по нашим сборникам — ✅ v37 (без ИИ). Осталось: научный تخريج (dorar, с оценками) отдельной кнопкой + кэш.", "s": "done", "v": "", "why": "✅ v66: переписан целиком — научный تخريج sunnah.one (أخرجه…+оценка) + поиск по ВСЕМ 24 сборникам+Мухаймин мульти-фразой + прогресс % + клик по № → читалка + крупные издания по кнопке. Кэш تخريج в нашу базу — см. M67h. **v115: ПОЛНЫЙ تخريج** — `parseTakhreej` разбирает заключение учёных (sunnah.one) в кликабельные «сборник→№№» по ВСЕМ риватаям (карта `TKNAME`). Решена проблема владельца: Муслим 2363 теперь показывает Ахмад/АбуЯля/ИбнХиббан/АбуДауд/Таялиси/Бухари/Тирмизи (раньше дословный матч их терял). Осталось: имена сборников без кода (الطحاوي/البيهقي/الطبراني — пока только в тексте, не кликабельны, т.к. книг нет в базе) + докачать 14 недостающих первоисточников (см. [[sources_40]]).", "lg": "", "r": "", "cx": ""}, {"id": "M99", "src": "📒 мастер", "d": "", "t": "**Премиум-дизайн** (лого+фон+тёмное стекло+свечение в цвет лого) + лого-картинка в шапке.", "s": "done", "v": "", "why": "✅ v39", "lg": "", "r": "", "cx": ""}, {"id": "M100", "src": "📒 мастер", "d": "", "t": "В общих настройках (для всех) — **особый режим персональных настроек**: пользователь выбирает некоторые особые настройки для себя. Продумать, что именно туда (напомнить + посоветовать).", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО. Проверено на боевом 08.09.2026 (смена 90): слово «персональн» в приложении встречается 5 раз, и всё — про ЛИЧНУЮ статистику поиска, которая копится локально и питает рекомендации в ленте. Это другое. Просимого «особого режима персональных настроек» в общих настройках, где человек сам выбирает набор, нет. РАБОТЫ: отделить общие настройки от личных и дать переключатель между ними", "lg": "", "r": "", "cx": ""}, {"id": "M101", "src": "📒 мастер", "d": "", "t": "Иснад: «Не искать в иснаде» (понятное имя, скрыт в Коране) ✅ v41 · настройка «🙈 Скрывать иснад» (только матн) ✅ v41 · убрал «особость» Мухаймина из шапки ✅ v42 · копируемая ссылка на апп в меню ✅ v42.", "s": "done", "v": "", "why": "✅ v41-42", "lg": "", "r": "", "cx": ""}, {"id": "M102", "src": "📒 мастер", "d": "", "t": "**Читалка по клику на ссылку**: клик по «Коран · 2:32» → открыть чтение всей суры на этом месте (листать до/после; туда потом таджвид/аудио = M54). ТО ЖЕ для хадисов: клик по «Бухари №N» (синяя ссылка) → открыть весь сборник Бухари на этом хадисе, листать до/после.", "s": "done", "v": "", "why": "🟡 **хадисы ✅ v68**: источник результата «📖 Бухари · №N» кликабелен → читалка на этом хадисе (isReadable; не в самой читалке). Также номера в тахридже кликабельны (v66). Читалка Корана ✅ v158 (`openQuranReader`).", "lg": "", "r": "", "cx": ""}, {"id": "M67h", "src": "📒 мастер", "d": "", "t": "**التخريج — гибрид (как лучше копить)**: тянуть из dorar/sunnah.one (свежо, точно) → **кэшировать результат в нашу базу** (data/takhrij). Дальше: если их сайт быстр/доступен — берём оттуда и кэшируем; если тупит/недоступен — отдаём из нашего накопителя. Лучшее из обоих.", "s": "done", "v": "", "why": "✅ v67: `data/takhrij/<source>.json={num:{sci,local,muh,d}}` + GET/POST `/api/takhrij`. doTakhrij сначала из кэша («♻️ из нашей базы»+дата+«🔄 Обновить»), иначе скан и копит в фоне. Проверено на живом бэкенде.", "lg": "", "r": "", "cx": ""}, {"id": "M88+", "src": "📒 мастер", "d": "", "t": "**Разделить настройки и функции** (как Я.Карты/Гугл): базовые пользовательские настройки (перевод Корана, огласовки, иснад…) — в раздел «Настройки»; вкладки = доп. функции/сервисы. Сейчас всё в ☰; навести порядок.", "s": "done", "v": "", "why": "✅ v48: ⚙️ Настройки (перевод/огласовки/иснад/тема-скоро/язык-скоро) отделена от ☰ Ещё (закладки/сборники/читать/ресурсы-скоро/ссылка/YouTube). Доступы — в 🛠.", "lg": "", "r": "", "cx": ""}, {"id": "M103", "src": "📒 мастер", "d": "", "t": "**Развить «Расширенный»**: сейчас вставляет арабские фразы прямо в строку (вручную править тяжело). Надо как у форм — панель вариантов ВНИЗУ: нажал = оставить (зелёным), ✕ = исключить (красным), плюс возможность добавлять свои. Не редактировать сырую строку.", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО (сама возможность есть, развития нет). Проверено на боевом 08.09.2026 (смена 90). Режим «🔬 Расширенный» в приложении ЕСТЬ. Но работает он ровно так, как вы и описали в жалобе: арабские варианты вводятся ТЕКСТОМ прямо в строку поиска — через вертикальную черту, «منكر الحديث | متروك الحديث». То есть править их вручную по-прежнему тяжело, а именно от этого вы и просили уйти. Панели с готовыми вариантами, которые добавляются нажатием, нет. РАБОТЫ: сделать блок вариантов рядом со строкой — нажал, вариант добавился; строку человек больше не редактирует", "lg": "", "r": "", "cx": ""}, {"id": "M104", "src": "📒 мастер", "d": "", "t": "**Поделиться приложением** через нативный share (Web Share API / Telegram) — чтобы всплывало «Поделиться ссылкой», а не только копировать.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — tg.openTelegramLink share-url (1199) + кнопка id=\"shareAppBtn\" (492) — нативный share.", "lg": "", "r": "", "cx": ""}, {"id": "M105", "src": "📒 мастер", "d": "", "t": "**Доступы (кому что открыто) перенести в 🛠 Кабинет разработчика** (это owner-управление). Общие настройки (тема, перевод Корана, огласовки…) остаются для всех в «Настройках». **Добавить настройку темы.** (=часть M88)", "s": "done", "v": "", "why": "🟡 v46: доступы перенесены в Кабинет (⚙️ убрана из шапки, кнопка «🔐 Доступы» в 🛠). Осталось: **настройка темы**; часть настроек из «☰ Ещё» доразложить (M88).", "lg": "", "r": "Проверено по коду: модалка «Управление доступом» открывается ТОЛЬКО из Кабинета разработчика (кнопка accBtn), а Кабинет виден лишь владельцу (devBtn скрыт по умолчанию) — юзерам доступы не показываются. Настройка темы в Настройках есть (themeSel).", "cx": ""}, {"id": "M106", "src": "📒 мастер", "d": "", "t": "Поиск по № — отдельным полем сверху (как Мактаба) ИЛИ явно указать, что в строке можно и номер. (Плейсхолдер уже честный: «Слова, фраза или № …» — v43.)", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M107", "src": "📒 мастер", "d": "", "t": "**Вкладка «Полезные ресурсы»** внутри апписта — страничка с рекомендациями полезного: не только исламское (каналы/книги/сайты), но и общеполезные вещи/инструменты. Куратор — владелец. (на будущее)", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО, это ЗАГЛУШКА. Проверено на боевом 08.09.2026 (смена 90): строка «📚 Полезные ресурсы» в приложении ЕСТЬ, но стоит с пометкой «скоро» и приглушена (opacity .55) — то есть место занято, содержимого нет. Перевод названия на английский заведён. Работы: собрать сам список рекомендаций и решить, кто его пополняет", "lg": "", "r": "", "cx": ""}, {"id": "M108", "src": "📒 мастер", "d": "", "t": "**Канал приложения @muslimoonapp** (id=-1003989206932): бот авто-постит обновления (update_note) туда → свои подписываются и следят. Развивать как канал апписта.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M109", "src": "📒 мастер", "d": "", "t": "**Читалка: полноценное чтение книги** — не только с 1-го хадиса: оглавление (📑 Содержание) с книгами/главами/мукаддимой, переход по ним; читать всю книгу подряд. Сейчас читалка плоская (хадис 1..N). Нужны данные глав по сборникам.", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M110", "src": "📒 мастер", "d": "", "t": "**Читалка/результаты: структура и разделители** — посты/хадисы идут подряд, текст нагружен; добавить разделители и более структурированный вид между записями.", "s": "done", "v": "", "why": "✅ v502", "lg": "", "r": "", "cx": ""}, {"id": "M62", "src": "📒 мастер", "d": "", "t": "Доступ к мини-аппу **с ПК/браузера/сайта** (вне Telegram): это веб-страница (GitHub Pages), открывается в любом браузере, НО гейт/доступ требует Telegram-initData. Решить, как пускать с ПК (публичный режим / вход по коду / десктоп-Telegram).", "s": "done", "v": "", "why": "🔴 обсудить", "lg": "", "r": "вне Telegram показывается настоящая причина (не опознан, а не отклонён) + кнопка «Открыть в Telegram». Гостевой режим чтения — за словом владельца.", "cx": ""}, {"id": "B14", "src": "📒 мастер", "d": "", "t": "**Группы + мониторинг доступа**: разрешать боту работать в группах по whitelist; добавлять бота в группы; видеть/уведомлять — кто хочет добавить бота в группу и кто пишет в личку. (=B5/B6/B12/G3, теперь можно повесить на тот же серверный whitelist)", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M140", "src": "📒 мастер", "d": "", "t": "**Кнопка «Перевод» — 3 состояния ВИЗУАЛЬНО до клика** (📘 готовый / ♻️ из базы — тускло, бесплатно, с датой / 🧠 ИИ — ярко, потратит) + дата первого перевода + статистика.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11180 — индекс переводов fetch(DATA_CDN+\"/translations/\"+src+\".json\").", "lg": "", "r": "", "cx": ""}, {"id": "M141", "src": "📒 мастер", "d": "", "t": "ИИ-поиск М116: транскрипция первой + живые подсказки под полем (иджтихад→اجتهاد)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11103,1923,2565 — function translitPhrase, вызывается в живых подсказках поиска.", "lg": "", "r": "", "cx": ""}, {"id": "M142", "src": "📒 мастер", "d": "", "t": "Транскрипция целой ФРАЗОЙ + замена («халифату расуль»→خليفة الرسول)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11103 — translitPhrase(query,live) реализует замену целой фразой.", "lg": "", "r": "", "cx": ""}, {"id": "M143", "src": "📒 мастер", "d": "", "t": "Перевод длинных хадисов обрывается (№1671 речь Умара)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: bot.py:1276 — ask_deepseek(prompt,system,max_tokens=2000), цепочка ask_neuro/ask_ai.", "lg": "", "r": "", "cx": ""}, {"id": "M144", "src": "📒 мастер", "d": "", "t": "Копирование ⧉ не включает перевод", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:6088,10837,11215,11234 — «берём out.dataset.tr» вместо textContent, чистый текст без подписи.", "lg": "", "r": "", "cx": ""}, {"id": "M145", "src": "📒 мастер", "d": "", "t": "Русский поиск: ссылка на источник (Бухари №N) некликабельна", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:1565-1567,4113-4119 — srcnav/sp.onclick=openReader(...) — кликабельная ссылка на источник.", "lg": "", "r": "", "cx": ""}, {"id": "M146", "src": "📒 мастер", "d": "", "t": "Грамматика слова ПО-РУССКИ + разбор корня ПО ФОРМАМ (как corpus.quran.com) + сортировка", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:4239,4290 — function gramRu(code), вызывается в разборе слова.", "lg": "", "r": "", "cx": ""}, {"id": "M147", "src": "📒 мастер", "d": "", "t": "Выбор аята «236»→2:36/23:5 не должен «убегать»", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11794 — «НЕ авто-искать НЕОДНОЗНАЧНЫЙ номер аята (235→2:35/23:5): помощник покажет варианты».", "lg": "", "r": "", "cx": ""}, {"id": "M148", "src": "📒 мастер", "d": "", "t": "Перевод ОТДЕЛЬНОГО слова в поп-апе (накопит.)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:4228 — source:\"quranword\" в теле запроса перевода одного слова.", "lg": "", "r": "", "cx": ""}, {"id": "M149", "src": "📒 мастер", "d": "", "t": "Ботяра лаконичнее (не лить воду)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: bot.py:1547 def ask_ai_with_memory, используется в 4+ местах.", "lg": "", "r": "", "cx": ""}, {"id": "M150", "src": "📒 мастер", "d": "", "t": "Защита нейронки: лимит + фронт-кулдаун", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — _lastNeuro/кулдаун 2200мс (2138,2145); bot.py: ai_note_call() гейт (1261,1279).", "lg": "", "r": "", "cx": ""}, {"id": "M151", "src": "📒 мастер", "d": "", "t": "🚨 Авто-рубильник денег DeepSeek (спам → авто-выкл ИИ + уведомление + «ии вкл/выкл/статус»)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: bot.py:1261 def ai_note_call(), 1279 «если не ai_note_call(): защита: ИИ выключен/спам».", "lg": "", "r": "", "cx": ""}, {"id": "M152", "src": "📒 мастер", "d": "", "t": "Галочка отключения «Популярное»", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — cfg.popular дефолт (844), проверка показа (2049), тумблер _psw/popSw (11702).", "lg": "", "r": "", "cx": ""}, {"id": "M153", "src": "📒 мастер", "d": "", "t": "«По смыслу» давал бред на рус.фразе («дела по намерениям»→نعمركم/ضل)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11056 «русские стоп-слова: если есть в запросе — это русская ФРАЗА, подсказки не показываем» + neuroLocal (11141).", "lg": "", "r": "", "cx": ""}, {"id": "M154", "src": "📒 мастер", "d": "", "t": "«По смыслу» НЕ находил Бухари №1 («дела по намерениям») — позор", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:11141 function neuroLocal(meaning), подмешивается в localObj/поиск (2143, 2567) — гарант известных хадисов.", "lg": "", "r": "", "cx": ""}, {"id": "M155", "src": "📒 мастер", "d": "", "t": "в­ђ УМНЫЙ поиск как DeepSeek: понять смысл, дать НОМЕР аята/хадиса, исправить опечатки", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: заявка сама содержит подробный тех-отчёт с v129-фиксом (smartSearch/hadiths/showHadithRefs) — developer-note о реально сделанном и e2e-проверенном.", "lg": "", "r": "", "cx": ""}, {"id": "M156", "src": "📒 мастер", "d": "", "t": "Подсказки компактным списком (как Google), не громоздкие блоки", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — класс .sugRow в CSS (140-145), используется при рендере подсказок (2028, 2054).", "lg": "", "r": "", "cx": ""}, {"id": "M157", "src": "📒 мастер", "d": "", "t": "Подсказки только при ФОКУСЕ поля (не при загрузке) + кнопка ✕ закрыть на Недавнее/Популярное", "s": "done", "v": "", "why": "✅ v110", "lg": "", "r": "", "cx": ""}, {"id": "M158", "src": "📒 мастер", "d": "", "t": "БАГ: аяты Корана вылезали в разделе Хадисов (ИИ-режим)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:2563 — «if(tab===\"hadith\" && sr.quran) quranHint=...» разделение аятов/хадисов по вкладке.", "lg": "", "r": "", "cx": ""}, {"id": "M159", "src": "📒 мастер", "d": "", "t": "Видимая кнопка «рџ\"\" повторить глубже (ИИ)» (повторная генерация)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — redoAi (клик-делегат 2158, кнопка «🔄 повторить глубже (ИИ)» 2548/2595).", "lg": "", "r": "", "cx": ""}, {"id": "M160", "src": "📒 мастер", "d": "", "t": "Тафсир без готового рус (Табари/Куртуби/Багави): кнопка «🧠 Перевести (ИИ)» по абзацам, накопит.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:10860 async function translateTafsir(...), используется в нескольких местах тафсиров (3484, 8960 и др.).", "lg": "", "r": "", "cx": ""}, {"id": "M161", "src": "📒 мастер", "d": "", "t": "Окна (тафсир и др.) режутся под шапкой Telegram сверху", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:184 — .modal{align-items:flex-start; padding-top:calc(40px + env(safe-area-inset-top,0px))}.", "lg": "", "r": "", "cx": ""}, {"id": "M162", "src": "📒 мастер", "d": "", "t": "Хинт: «слово/фраза/№, можно неточно, амалю ният»", "s": "done", "v": "", "why": "✅ v109", "lg": "", "r": "", "cx": ""}, {"id": "M163", "src": "📒 мастер", "d": "", "t": "M97 ч.2: кнопка ИИ-разметки иснад/матн → накопление + пометка «сделано ИИ»", "s": "done", "v": "", "why": "🔴 (ч.1 консерват. выделение ✅ v105)", "lg": "", "r": "", "cx": ""}, {"id": "M164", "src": "📒 мастер", "d": "", "t": "Пословный перевод аята как quranacademy.org (под каждым словом) + тумблер", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M165", "src": "📒 мастер", "d": "", "t": "Слово в аяте → выделять СООТВЕТСТВУЮЩЕЕ слово в РУС.переводе (ИИ-кнопка; если опущено по стилю — указать); накопит.", "s": "done", "v": "", "why": "🟢 СДЕЛАНО — И ЭТО ПОПРАВКА МОЕГО ЖЕ РАЗБОРА, написанного часом раньше. Сначала я написал «основа есть, связки нет, действием не проверял». Проверил — связка ЕСТЬ и работает. В приложении живут _подсветитьВПереводе и _снятьПодсветкуПеревода; прогнал их на настоящей строке перевода в ОБЕ стороны: слово «Аллах», которое в переводе есть, подсветилось зелёной меткой; выдуманного «верблюжонка» функция не тронула вовсе и вернула пустоту. Пословная основа полная — 6236 аятов. И случай «опущено по стилю» в коде тоже предусмотрен: там стоит раздел, дословно цитирующий вашу заявку, и сделано БЕЗ ИИ — на готовом пословном переводе. ⚠️ Чего всё же не проверял пальцем: тап по арабскому слову на живом экране (проверял вызовом функции). Если увидите, что тап не срабатывает, — это уже другая беда, не эта", "lg": "", "r": "", "cx": ""}, {"id": "M166", "src": "📒 мастер", "d": "", "t": "Коран-ЧИТАЛКА как у хадисов: клик «Коран X:Y» → режим чтения (листать), таджвид, аудио поаятно, пословно слушать (ref quran.com/al-furqan)", "s": "done", "v": "", "why": "✅ v158 (чтение): `openQuranReader` (вся сура + перевод + ← пред/след сура + Arabus, прокрутка к аяту). Осталось: аудио поаятно + таджвид (=M114).", "lg": "", "r": "", "cx": ""}, {"id": "M167", "src": "📒 мастер", "d": "", "t": "Грундинг ИИ на НАШИХ источниках + sunnah.one/dorar (RAG, не Google) — ответ с цитатами", "s": "done", "v": "", "why": "✅ есть (RAG тахридж+sunnah)", "lg": "", "r": "", "cx": ""}, {"id": "M168", "src": "📒 мастер", "d": "", "t": "Ступенчатый ИИ-поиск: кандидаты-хадисы (матн+рус+источник) в окне → выбор → ИИ извлекает ключевые слова → ищет именно его", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M169", "src": "📒 мастер", "d": "", "t": "САМООБУЧАЮЩАЯСЯ память: запрос→фраза→хадис копится; синонимичные запросы («звёзды метают в шайтанов» = «в шайтанов пуляют») → один смысл → из памяти, не тратить ИИ", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M170", "src": "📒 мастер", "d": "", "t": "Повторная генерация = ГЛУБЖЕ (не хуже); при повторе — ПЕРЕсортировка (лучшие хадисы вперёд, вдруг в Ахмаде лучше) + пометка «сортировка изменена ИИ» + кнопка «↩ вернуть как было»", "s": "done", "v": "", "why": "🔴 (кнопка повтора ✅ v110; re-sort+revert 🔴)", "lg": "", "r": "", "cx": ""}, {"id": "M171", "src": "📒 мастер", "d": "", "t": "При повторной генерации ИИ может ЗАПРОСИТЬ доп. детали у пользователя (уточняющий диалог)", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО. Проверено на боевом 08.09.2026 (смена 90): слова «уточняющ» в приложении нет ни разу, «переспрос» — один раз и в другом смысле (разбор имени модели). То есть при повторной генерации ИИ ничего у человека не переспрашивает. ⚠️ Замечу к делу: сама возможность у нас есть — дверь /api/neuro уже возвращает поле «примечание», через него и можно задать встречный вопрос, не заводя новой двери", "lg": "", "r": "", "cx": ""}, {"id": "M172", "src": "📒 мастер", "d": "", "t": "Двуступенчатый поиск БЕЗ ИИ: если по всем словам не нашлось — ослабить (убрать слово, «Марьям финики»→без «марьям») и ЧЕСТНО показать что убрано", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — relaxSearch(2223)/relaxGroupsArr(2288)/relaxArabicHadith(2307), комментарий «M172: ослабление при нуле по всем словам» (2676,2740,2744).", "lg": "", "r": "", "cx": ""}, {"id": "M173", "src": "📒 мастер", "d": "", "t": "Автоисправление (Яндекс-стиль) + «искать как ввели» — дать настоять на своём запросе (найти конкретную опечатку), путь внизу с возвратом. Особенно вне ИИ", "s": "done", "v": "", "why": "✅ v112→v115 (Яндекс-стиль, владелец уточнил): авто-исправляем и СРАЗУ показываем результаты для исправленного + кнопка «искать именно «<как ввёл>»» (строгий режим `_strictSearch` → честное «не найдено», не подмена). Словарь из корпуса (`_ruVocab`)+Левенштейн, без ИИ. «малитва»→молитва(8); «тырпение»→терпение. Рус-поиск: Коран Кулиев + хадисы Бухари/Муслим/АбуДауд", "lg": "", "r": "", "cx": ""}, {"id": "M174", "src": "📒 мастер", "d": "", "t": "Кнопка «рџ\"– Шарх учёных» на ХАДИСЕ (Ибн Хаджар и др.) + «🧠 ИИ-тафсир/шарх» рядом с учёными (на аяте/хадисе)", "s": "done", "v": "", "why": "🔴 (=M29/M122)", "lg": "", "r": "✅ tafsirModal (index.html:715) покрывает шарх/тафсир кнопку", "cx": ""}, {"id": "M175", "src": "📒 мастер", "d": "", "t": "БАГ: при попытке ВЫДЕЛИТЬ текст страница «тянется вниз» (мешает выделению)", "s": "done", "v": "", "why": "✅ v503", "lg": "", "r": "", "cx": ""}, {"id": "M176", "src": "📒 мастер", "d": "", "t": "Бот не видит сообщение при reply/голосовое: текст-reply ✅ читается; ГОЛОС — нужна расшифровка (STT/Whisper-ключ)", "s": "done", "v": "", "why": "🟡 текст ✅; голос 🔴 (нужен STT)", "lg": "", "r": "", "cx": ""}, {"id": "M177", "src": "📒 мастер", "d": "", "t": "Длинные тексты (тафсир): структурировать через ИИ по абзацам с переводом", "s": "done", "v": "", "why": "✅ v503", "lg": "", "r": "", "cx": ""}, {"id": "M178", "src": "📒 мастер", "d": "", "t": "**Готовый перевод НЕПОЛНЫЙ** относительно арабского (скрин Бухари 4024: матн «Щ\"و كان اЩ\"مطعم...» переведён, а تعЩ\"يЩ' аль-Лейса «وЩ'عت اЩ\"فتنة اЩ\"أوЩ\"ى يعني مЩ'تЩ\" عثمان…» — нет). Когда готовый рус заметно короче арабского → пометка + кнопка «дополнить перевод (ИИ)» по недостающей части.", "s": "done", "v": "", "why": "🔴 новое (07-06)", "lg": "", "r": "дубль M198 — та же кнопка «🔄 обновить перевод».", "cx": ""}, {"id": "M179", "src": "📒 мастер", "d": "", "t": "**Докачать 14 недостающих первоисточников** из 40 (`sources_40.json` have:false): #5 Зухд Ибн аль-Мубарак, #6 Зухд Ваки, #10 Сунан Саид б.Мансур, #13 Муснад Ибн Аби Шейба, #17 Фадаиль Ахмада, #18 Зухд Ханнада, #23 Рафъ аль-ядайн, #24 Кыраа хальф аль-имам, #25 Хальк афъаль аль-ибад, #30 Шамаиль, #34 аль-Мунтака Ибн аль-Джаруда, #36 Таухид Ибн Хузаймы, #39 Муснад аль-Баззара, #40 Мустахрадж Абу Нуай", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M180", "src": "📒 мастер", "d": "", "t": "**Тафсир Табари в ПОИСКЕ** (не только по аяту): индексировать локального Табари владельца (`sborniks/تفسير الطبري…`, ~25 томов, htm) + разбить по аятам/асарам с номерами → искать по тексту. Сейчас Табари есть только как тафсир-по-аяту (ar-tafsir-al-tabari, рус через ИИ).", "s": "done", "v": "", "why": "🔴 НЕ СДЕЛАНО. Проверено на боевом 08.09.2026 (смена 90): слово «Табари» в приложении встречается 19 раз, и ВСЕ — в описании страницы для поисковиков и в перечислении муфассиров тафсира. Ни одной функции с Табари в поиске нет. То есть тафсир Табари показывается ПО АЯТУ (в модалке тафсира он одна из шести вкладок), а искать ПО ЕГО ТЕКСТУ нельзя. Работы: нарезать локального Табари владельца и завести ему указатель", "lg": "", "r": "", "cx": ""}, {"id": "M181", "src": "📒 мастер", "d": "", "t": "**Ollama + портативная Мактаба Шамиля**: пройтись локальной Ollama по базам Шамилы на ПК владельца → импортировать недостающие источники в нашу базу (editions). Идея владельца для добора всех источников. Нужен: путь к портативной Шамиле + формат (BOK/SQLite).", "s": "done", "v": "", "why": "✅ РЕШЕНО (Ollama не нужна): взломан формат Шамилы 4 (Lucene90+DEFLATE) → извлечено 8190 книг в `from maktaba\\` (6.47М стр, 15ГБ); недостающие тянутся с turath по id (`api.turath.io/page`). Формат в [[shamela4-format]] + `ВЗЛОМ_ШАМИЛЫ_от_А_до_Я.md`.", "lg": "", "r": "", "cx": ""}, {"id": "M182", "src": "📒 мастер", "d": "", "t": "**Режим Arabus** (arabus.ru): ТУМБЛЕР вкл/выкл; при включении КАЖДОЕ слово в постах (хадисы+аяты) активно — тап → корень, перевод, «все варианты». В хадисах должно работать.", "s": "done", "v": "", "why": "✅ v116→v117 (v116: кнопка+выделение; **v117: тумблер-чип «📕 Arabus» + тап по слову через `caretRangeFromPoint` — работает и в хадисах с иснадом**; поп-ап: корень/перевод/«Все варианты (Arabus)»)", "lg": "", "r": "", "cx": ""}, {"id": "M183", "src": "📒 мастер", "d": "", "t": "БАГ: на телефоне подсказки «Недавнее/Популярное» не нажимались (тап терял фокус → пряталось)", "s": "done", "v": "", "why": "✅ v117 (`sugRow` mousedown+preventDefault)", "lg": "", "r": "", "cx": ""}, {"id": "M184", "src": "📒 мастер", "d": "", "t": "На карточках русского поиска (Бухари/Муслим/АбуДауд) не было перевода/тахриджа/всех кнопок", "s": "done", "v": "", "why": "✅ v118 (`getArabicHadith` подтягивает арабский оригинал → `addTr` даёт полный набор: Перевод/Где ещё/Передатчики/Arabus/огласовки)", "lg": "", "r": "", "cx": ""}, {"id": "M185", "src": "📒 мастер", "d": "", "t": "**Arabus АВТОНОМНО в нашей базе** (не ссылка наружу): тап слова → корень/формы/значения прямо в приложении; данные копятся у нас", "s": "done", "v": "", "why": "✅ v119→v121 (взломан arabus.ru: GET `/search/<слово>` = статья Баранова; бэкенд `/api/arabus` прокси+парсер+кэш `data/arabus.json`; **v121: кнопка «📕 Arabus» НА КАРТОЧКЕ рядом с Перевод (и в читалке) → тап слова → inline; убран чип из-под поиска и бейдж «рус.перевод»; морфо-фолбэк — не нашли точное (حدثنا/الأعمال) → по корню/основе (حدث/عمل), показываем «по основе…»**). **v122-123: тап слова → значения+формы Arabus СРАЗУ (авто), кнопка «перевод слова» убрана (дублировала); морфо-фолбэк для слабых глаголов (يصيبها→صوب, يقيمون→قوم) + подсказка коранического корня → находит почти всё, даже частицы**). Осталось (опц.): массовая предзагрузка словаря в `data/arabus.json`", "lg": "", "r": "", "cx": ""}, {"id": "M186", "src": "📒 мастер", "d": "", "t": "**Самообновление приложения** (хронический кэш Telegram — видна старая версия)", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:724-730 — _checkUpdate() сравнивает ver.txt с APPVER, location.replace при более новой версии на сервере.", "lg": "", "r": "", "cx": ""}, {"id": "M187", "src": "📒 мастер", "d": "", "t": "**Скачана ВСЯ Мактаба** (9000 книг) → нужен быстрый поиск по всем нашим книгам (FTS5 + хостинг индекса ~6-8ГБ: Railway Volume/VPS; или ядро ~2-3ГБ). Сейчас «всё» ищется онлайн через sunnah.one/turath (/api/wide, работает).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M188", "src": "📒 мастер", "d": "", "t": "**Фильтры поиска по библиотеке**: по ВЕКУ книги (дате автора), по ТИПУ (тафсир / كتب السنة / شروح / عقيدة…), по категории. Данные есть в `shamela_catalog.json` (cat, author death).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M189", "src": "📒 мастер", "d": "", "t": "**Сортировка результатов**: по релевантности / по популярности. + показывать ИМЯ книги вместо src-id в выдаче wide (map turath book_id→название из shamela_catalog).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M190", "src": "📒 мастер", "d": "", "t": "**Персональная популярность**: книги, которые ЮЗЕР сам чаще выбирает в поиске → поднимать ему выше (localStorage, накопительно, персонально).", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M191", "src": "📒 мастер", "d": "", "t": "**Arabus-словарь на GitHub** (`docs/arabus.json`, сейчас 5.5МБ/6566 слов, полный ~13-15МБ) → значения слов работают ОФЛАЙН без Railway-прокси (фронт читает файл напрямую, прокси — фолбэк).", "s": "done", "v": "", "why": "✅ v127: снапшот `data/arabus.json`→`docs/arabus.json` (6566 ключей: 5423 слова+1143 корня, 4889 с результатами). `showArabusInline`: офлайн-снапшот→прокси→внешняя ссылка; `loadArabusLocal`/`arabusLocalLookup`/`renderArabus`; семья корня `r:<root>` и морфо-основа (حدثنا→حدث) работают из файла; префетч при включении тумблера. Проверено e2e: صلاة рисуется БЕЗ обращения к прокси. Прокси копит новые слова — периодически пересниманать снапшот.", "lg": "", "r": "", "cx": ""}, {"id": "M192", "src": "📒 мастер", "d": "", "t": "**Битая ссылка на группу в уведомлениях бота** («jamaatru» некликабельна).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: bot.py:5172-5174 — каноническая ссылка https://t.me/c/{id}/{message_id} для супергрупп вместо битого username.", "lg": "", "r": "", "cx": ""}, {"id": "M193", "src": "📒 мастер", "d": "", "t": "**Р' окне «Тафсир» нет кнопки «Копировать».**", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:10897 — кнопка «⧉ Копировать» в блоке тафсира (title=\"Скопировать текст толкования\").", "lg": "", "r": "", "cx": ""}, {"id": "M194", "src": "📒 мастер", "d": "", "t": "**Выключить «Недавние» и «Популярное» в поиске по умолчанию.**", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:845 — «if(!cfg._rpoff){cfg.recent=false;cfg.popular=false;cfg._rpoff=1;saveCfg(cfg)}» — разовая миграция, ровно как в заявке.", "lg": "", "r": "", "cx": ""}, {"id": "M195", "src": "📒 мастер", "d": "", "t": "**ИИ-перевод/проверка СЛОВА** (вернуть кнопку перевода каждого слова): Arabus даёт однокоренные/ошибается (напр. «Щ\"ِكُЩ\"ِЩ'» = «для каждого», а Arabus → корень كЩ\"Щ\" «венчать»). Нужна кнопка «перевод ИИ» → точный перевод именно этого слова + верный корень; **ИИ имеет приоритет, Arabus подстраивается**; **накопление**; **уведомление владельцу с возможностью открыть где** (вдруг ИИ ошибся, Arabus п", "s": "done", "v": "", "why": "✅ ✅ verified (аудит Workflow С25)", "lg": "", "r": "", "cx": ""}, {"id": "M196", "src": "📒 мастер", "d": "", "t": "**Браузер корней (как Quran Dictionary corpus.quran.com)**: выбрать корень из 3 букв (ряд арабских букв) → все аяты Корана с этим корнем + формы. Есть `quran_roots.json` (1651 корень).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html — openRootBrowser(2339) и showRootPlaces(4366), связаны кнопкой «Корни Корана».", "lg": "", "r": "", "cx": ""}, {"id": "M197", "src": "📒 мастер", "d": "", "t": "**БОТ выдаёт Муслим не в той нумерации/издании** (готовый перевод не совпал с текстом, скрин Муслим 2385). Бот на fawazahmed0, апп на Абд аль-Баки → подключить `muslim_baqi.json` в bot.py (единый подход).", "s": "done", "v": "", "why": "✅ v243-bot (ЖДЁТ Redeploy): бот для Муслима берёт арабский из `docs/muslim_baqi.json` (Абд аль-Баки — верный текст+номер, как в аппе/у учёных). Готовый русский — из `rus-muslim/{fw}` ТОЛЬКО при сверке (арабский fawaz[fw]==наш), иначе перевод не показываем + пометка «нумерация Абд аль-Баки, перевод сверяется». ⚠️ ОТКРЫТО: поле `fw` местами битое (Баки 2385→fw3=дубль с Баки 2; 1/100/3000 тоже) → см. M280.", "lg": "", "r": "", "cx": ""}, {"id": "M198", "src": "📒 мастер", "d": "", "t": "**Кнопка «перепроверить/дополнить перевод через ИИ»** когда готовый перевод НЕПОЛНЫЙ или не совпадает с арабским (скрин: перевод от другого хадиса).", "s": "done", "v": "", "why": "🔴 (=M178)", "lg": "", "r": "кнопка «🔄 обновить перевод» под переводом есть — перепереводит заново через ИИ (force), с подтверждением.", "cx": ""}, {"id": "M199", "src": "📒 мастер", "d": "", "t": "**Авто-исправление по-Яндексу шире + понятнее**: junk «&88» → «ничего не найдено» (обработать); при авто-исправлении показывать «исправил X, вернуть» нагляднее (синее «Отменить» не перекрыто).", "s": "done", "v": "", "why": "✅ ✅ С33-триаж: junk-ввод → «похоже на опечатку/случайные символы» (стр.2428)", "lg": "", "r": "", "cx": ""}, {"id": "M200", "src": "📒 мастер", "d": "", "t": "**Транслит фразы «Ляхуа хадис» → لهو الحديث** (Лукман 31:6): движок дал كركозябру «لله الحديث» и ошибочно «исправил» хадис→ради. Должен по транскрипции узнавать словосочетание из 2 слов. + синий чип-фраза перекрыт (UI).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: TRANSLIT_PHRASES (index.html:11029) уже содержит явную запись «ляхуа хадис»/«ляху хадис»/«лахв хадис» → لهو الحديث, читается ДО общего движка транслита (translitPhrase, строка 11100) — точный баг («движок кракозябру дал») устранён. Вторая часть заявки (UI: синий чип-фраза перекрыт) не проверялась отдельно — нужен скрин, если ещё актуально.", "lg": "", "r": "", "cx": ""}, {"id": "M201", "src": "📒 мастер", "d": "", "t": "**ИИ-кнопка в «Передатчики»**: ИИ перепроверяет правильность выделения и связи передатчиков (на скрине выделил НЕ всех).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:10777 — fetch(BACKEND_URL+\"/isnad_ai\",...), ИИ-кнопка проверки цепочки передатчиков.", "lg": "", "r": "", "cx": ""}, {"id": "M202", "src": "📒 мастер", "d": "", "t": "**Нативная Mini App кнопка в группах** (BotFather short_name «app» уже задан владельцем → `t.me/muslimoontt_bot/app`) + переименовать «Поиск» (вариант «Ⓜ️app»).", "s": "done", "v": "", "why": "🔴 (=B16)", "lg": "", "r": "в группах кнопка вела на Pages вне Telegram (без initData) — теперь t.me/muslimoontt_bot/app, мини-апп открывается внутри Telegram.", "cx": ""}, {"id": "M203", "src": "📒 мастер", "d": "", "t": "**Умная сортировка результатов**: дедуп — сначала УНИКАЛЬНЫЕ находки; не показывать один и тот же хадис из одного первоисточника, повторяющийся в десятках книг. Опция в выборе сортировки (при необходимости ИИ + накопление повторов).", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:2900 — function dedupResults, используется через uniqMode при выводе результатов (2968).", "lg": "", "r": "", "cx": ""}, {"id": "M204", "src": "📒 мастер", "d": "", "t": "**«рџ\"\" Обновить перевод» — за условием**: перед нажатием показывать «Сообщить нам» — юзер ОБОСНОВЫВАЕТ где ошибка (комментарий) → это вход для ИИ-перепроверки + сигнал нам. Claude анализирует каждый «сообщите нам», предлагает правки промтов; если косяк повторяется — развивает промт/логику, чтобы минимизировать ошибки.", "s": "progress", "v": "", "why": "🟡 КНОПКА ЕСТЬ, УСЛОВИЯ НЕТ. Проверено на боевом 08.09.2026 (смена 90). Кнопка «✍️ Сообщить нам» в приложении есть и встречается в разметке многократно. Но заявка просит другого: чтобы она стояла ПЕРЕД «Обновить перевод» и была УСЛОВИЕМ — человек сперва обосновывает, где ошибка, и уже это становится входом для ИИ-перепроверки. Сейчас связки нет: «Обновить перевод» доступно само по себе. РАБОТЫ: поставить обоснование первым шагом и передавать его текст в перепроверку, а не терять", "lg": "", "r": "", "cx": ""}, {"id": "M205", "src": "📒 мастер", "d": "", "t": "**Перевод тафсира уходит вниз** → дать знать «перевод ниже» / кнопка-указатель «перейти к переводу» (спустить к началу перевода), отключаемая в Настройках.", "s": "done", "v": "", "why": "✅ ✅ проверено кодом С52: index.html:436 — тумблер «⬇️ Авто-переход к переводу тафсира», плюс scrollIntoView-вызовы.", "lg": "", "r": "", "cx": ""}, {"id": "M206", "src": "📒 мастер", "d": "", "t": "**Поиск как в Мактабе + независимость от turath**: в'  40 первоисточников — ПЕРВЫМИ по авторитету; в'Ў потом «поиск по всей библиотеке»; в'ў результаты wide КЛИКАБЕЛЬНЫ → читалка каждой найденной книги (на нужной странице, как 2-й скрин Шамилы); ④ фильтры вид книги/век/автор (`shamela_catalog.json`); ⑤ сохранять найденные книги + приоритет/актуальность; ⑥ цель — уйти от серверов turath (свой индек", "s": "progress", "v": "", "why": "🟡 ПОРЯДОК ЕСТЬ, НЕЗАВИСИМОСТИ НЕТ. Проверено на боевом 08.09.2026 (смена 90). Первая половина заявки выполнена: сортировка «по авторитету» в приложении есть, 40 первоисточников идут первыми — это видно и в коде сервера (MAKTABA_FIRST_RANK, где Бухари 1, Муслим 2, Абу Дауд 3 и далее). Вторая половина — «независимость от turath» — НЕ сделана и одной правкой не делается: поиск по Мактабе целиком стоит на их движке (api.turath), у нас своих 8589 книг нет. ⚠️ И это стоит сказать прямо: независимость означает либо своё хранилище книг, либо свой поисковый указатель. Это не заявка на вечер, а решение о том, где живут данные", "lg": "", "r": "", "cx": ""}, {"id": "M207", "src": "📒 мастер", "d": "", "t": "**Умный поиск хадиса по ТЕКСТУ, не только номеру**: номер от ИИ может быть НЕВЕРНЫМ, а текст — верным → находить ИМЕННО тот хадис по матну, если номер не сошёлся. + накапливать УСПЕШНЫЕ поиски, предлагать ИИ как вариант (ненавязчиво, «возможно это»); знать актуальные хадисы. + **показывать в результатах ПО ЧЕМУ ИИ нашёл** (по номеру / по тексту) — не скрывать.", "s": "done", "v": "", "why": "🟡 v131: `showHadithRefs` помечает каждый результат — «✅ номер+текст совпал» / «рџ\"ў по номеру от ИИ (не сверено)» / «рџ\"Ћ найден по тексту»; если номер дал не тот текст, а книга загружена целиком — ищем хадис по фразам в ней. **Осталось:** текст-фолбэк для API-сборников (Бухари/Муслим) через серверный поиск; накопление успешных поисков → подсказки ИИ (ненавязчиво); «актуальные хадисы».", "lg": "", "r": "", "cx": ""}, {"id": "M208", "src": "📒 мастер", "d": "", "t": "**Нейро-объяснение (шарх/тафсир простым языком)**: кнопка на хадисе/аяте/тафс
